<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Team</title>
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["full-access", "notifications", "menu-bar"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm ops room. Terse labels, nothing decorative, live work is the only thing that glows.
   IDEA: a dispatch board. Rooms are lines, teammates are stations, a running agent is a lit pointer.
   PICTURE: the working room itself: the feed, with live run cards lit in signal orange.
   COLOUR and TYPE: aluminium by day, #141517 by night, black ink, one orange pointer; Geist + Geist Mono.
   LAYOUT: drag bar on top, rooms and team rail at left, feed in the middle, log and settings drawer at right. */
:root{color-scheme:light dark;
--bg:light-dark(#e9eaec,#141517);--rail:light-dark(#dfe0e3,#0f1012);--card:light-dark(#f7f7f8,#1c1d21);
--ink:light-dark(#111214,#e9eaec);--mute:light-dark(#5b5f66,#9a9fa8);--line:light-dark(#cdd0d5,#2b2d32);
--hot:#ff4f00;--hot-ink:light-dark(#c23c00,#ff7a3d);--hot-soft:light-dark(#fff0e8,#2a1a11);
--ok:light-dark(#1d7a4b,#5cc08a);--bad:light-dark(#b42318,#ff7b6b);--code:light-dark(#e3e5e8,#24262b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,ui-sans-serif,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.mono,code,pre,.act,.ev,time{font-family:"Geist Mono",ui-monospace,Menlo,monospace}

#app{display:grid;grid-template-columns:232px minmax(0,1fr) auto;grid-template-rows:48px minmax(0,1fr);height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;border-bottom:1px solid var(--line);-webkit-app-region:drag;app-region:drag;user-select:none}
header button,header .chip{-webkit-app-region:no-drag;app-region:no-drag}
.desk.os-darwin header{padding-left:84px}
.brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.roomname{font-weight:500;white-space:nowrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 8px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.chip:hover{color:var(--ink)}
.grow{flex:1}
.readout{display:flex;align-items:center;gap:7px;font:500 12px "Geist Mono",monospace;color:var(--mute);white-space:nowrap}
.readout i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.readout.on{color:var(--hot-ink)}.readout.on i{background:var(--hot);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 25%,transparent)}
.tb{border:1px solid var(--line);background:var(--card);border-radius:7px;height:30px;padding:0 11px;font-size:13px;white-space:nowrap}
.tb[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.rail{grid-row:2;background:var(--rail);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 20px}
.rail h2{font-size:12px;font-weight:500;color:var(--mute);margin:6px 8px 6px}
.rooms button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:7px 8px;border-radius:7px;min-height:34px}
.rooms button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.rooms button[aria-current=true]{background:var(--card);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.rooms .n{margin-left:auto;background:var(--hot);color:#fff;border-radius:9px;font:500 11px "Geist Mono";padding:1px 6px}
.newroom{color:var(--mute)}
.mate{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;align-items:center;padding:7px 8px;border-radius:7px}
.mate small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate .st{font:11px "Geist Mono"}
.st.working{color:var(--hot-ink)}.st.missing{color:var(--bad)}.st.off,.st.external{color:var(--mute)}
form.nr{display:grid;gap:6px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;margin:6px 0}

.av{width:28px;height:28px;border-radius:7px;background:var(--c,#555);color:#fff;display:grid;place-items:center;font:600 11px "Geist Mono";flex:none}
.av.me{background:var(--ink);color:var(--bg)}
.av.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--hot);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--bg),0 0 0 4px color-mix(in srgb,var(--hot) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.av.on{animation:none}}

.room{grid-row:2;display:flex;flex-direction:column;min-height:0}
.banner{display:none;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--hot-soft);border-bottom:1px solid var(--line);font-size:14px}
.preview .banner{display:flex}
.banner .tb{background:var(--hot);border-color:var(--hot);color:#fff}
#scroll{flex:1;min-height:0;overflow:auto;padding:18px 0 8px;overscroll-behavior:contain}
.feed,.lives{max-width:860px;margin:0 auto;padding:0 24px}
.msg,.live{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:10px 0}
.meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px}
.meta b{font-weight:600}
.meta time{font-size:11px;color:var(--mute)}
.tag{font:500 10.5px "Geist Mono";color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.lnk{border:0;background:none;padding:0 2px;font:11px "Geist Mono";color:var(--mute);text-decoration:underline;text-underline-offset:2px;min-height:20px}
.lnk:hover{color:var(--ink)}.lnk.stop:hover{color:var(--bad)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55;margin-top:2px}
.txt code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:13px}
.txt pre{white-space:pre;overflow:auto;background:var(--code);padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.5;margin:6px 0}
.txt pre code{background:none;padding:0}
.txt a{color:var(--hot-ink)}
.at{font-weight:500;color:var(--c)}
.sys{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--mute);font-size:12.5px;padding:8px 0;text-align:center}
.sys .tb{height:26px;font-size:12px}
.day{display:flex;align-items:center;gap:10px;color:var(--mute);font:11px "Geist Mono";margin:10px 0}
.day::before,.day::after{content:"";flex:1;border-top:1px solid var(--line)}
.live{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--hot);border-radius:10px;padding:10px 14px;margin:8px 0}
.live.q{border-left-color:var(--line)}
.state{font:500 11px "Geist Mono";color:var(--hot-ink)}.q .state{color:var(--mute)}
.act{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.empty{max-width:520px;margin:12vh auto 0;padding:0 24px;color:var(--mute)}
.empty h3{color:var(--ink);font-size:22px;line-height:1.15;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
.sample{font-size:12px;color:var(--mute);text-align:center;margin:4px 0 10px}

.composer{padding:10px 24px 18px;max-width:908px;width:100%;margin:0 auto;position:relative}
.to{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px;font-size:12px;color:var(--mute)}
.to button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:2px 10px;font-size:12.5px;min-height:28px}
.to button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.box:focus-within{border-color:color-mix(in srgb,var(--ink) 40%,var(--line))}
#ta{flex:1;border:0;background:none;resize:none;outline:none;font-size:16px;line-height:1.45;max-height:220px;padding:5px 0}
.send{background:var(--ink);color:var(--bg);border:0;border-radius:8px;height:36px;padding:0 16px;font-weight:500}
.send:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.pop{position:absolute;bottom:100%;left:24px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgb(0 0 0/.15);padding:4px;min-width:220px;display:none}
.pop.open{display:block}
.pop button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:6px 8px;border-radius:6px;text-align:left}
.pop button[aria-selected=true]{background:color-mix(in srgb,var(--ink) 8%,transparent)}

.drawer{grid-row:2;width:440px;border-left:1px solid var(--line);background:var(--card);display:none;grid-template-rows:auto minmax(0,1fr);min-height:0}
.drawer.open{display:grid}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh h2{font-size:15px;margin:0;font-weight:600}
.db{overflow:auto;padding:14px 16px 28px}
.runs{display:grid;gap:4px;margin-bottom:14px}
.runs button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;text-align:left;font-size:13px}
.runs button[aria-current=true]{border-color:var(--ink)}
.runs small{color:var(--mute);font:11px "Geist Mono"}
.pill{font:500 10.5px "Geist Mono";padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.pill.running{color:var(--hot-ink)}.pill.done{color:var(--ok)}.pill.failed,.pill.stopped{color:var(--bad)}
.ev{display:grid;grid-template-columns:62px 58px minmax(0,1fr);gap:8px;font-size:11.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.ev time{color:var(--mute);font-size:11px}.ev .k{color:var(--mute)}
.ev .x{white-space:pre-wrap;overflow-wrap:anywhere}
.ev.k-text .x{font-family:Geist,sans-serif;font-size:13px}
.ev.k-error .k,.ev.k-stderr .k{color:var(--bad)}
details{margin:8px 0}summary{cursor:pointer;font-size:13px;color:var(--mute)}
details pre{white-space:pre-wrap;font-size:11.5px;background:var(--bg);padding:10px;border-radius:8px;max-height:320px;overflow:auto}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0 0 12px;display:grid;gap:8px}
legend{font-weight:600;font-size:13px;padding:0 4px}
label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
label.row{grid-template-columns:auto 1fr;align-items:center;gap:8px;color:var(--ink);font-size:13px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
input[type=text],input[type=number],select{height:34px;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:0 9px;font-size:14px;color:var(--ink)}
input.mono{font-size:13px}
.note{font-size:12.5px;color:var(--mute);line-height:1.5}
.found{font:11px "Geist Mono";color:var(--ok);overflow-wrap:anywhere}.found.no{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.err{color:var(--bad);font-size:13px}

.gate{position:fixed;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(4px);z-index:5;padding:24px}
.gate.open{display:grid}
.gate>div{max-width:470px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;box-shadow:0 20px 50px rgb(0 0 0/.18)}
.gate h3{margin:0 0 8px;font-size:24px;line-height:1.1;letter-spacing:-.015em}
.gate p{margin:0 0 10px;color:var(--mute);font-size:14.5px}
.booting #app{visibility:hidden}

@media(max-width:900px){.drawer.open{position:fixed;right:0;top:48px;bottom:0;width:min(440px,100vw);z-index:4;box-shadow:-10px 0 30px rgb(0 0 0/.15)}}
@media(max-width:600px){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:48px auto minmax(0,1fr)}
.rail{grid-row:2;border-right:0;border-bottom:1px solid var(--line);padding:8px;display:flex;gap:6px;overflow-x:auto}
.rail h2,.mates,.newroom,form.nr{display:none}.rooms{display:flex;gap:4px}.rooms button{width:auto;white-space:nowrap}
.room{grid-row:3}.brand{display:none}.feed,.lives{padding:0 14px}.composer{padding:8px 14px 14px}.readout b{display:none}.chip{display:none}}
</style>
</head>
<body class="booting">
<div id="app">
  <header>
    <span class="brand">Agent Team</span>
    <span class="roomname" id="roomname"># general</span>
    <button class="chip" id="folder" title="Open this room's folder">~</button>
    <span class="grow"></span>
    <span class="readout" id="readout"><i></i><b>All quiet</b></span>
    <button class="tb" id="pause" aria-pressed="false" title="Hold new runs; messages still post">Pause</button>
    <button class="tb" id="logbtn">Runs</button>
    <button class="tb" id="teambtn">Team</button>
  </header>
  <nav class="rail" aria-label="Rooms and team">
    <h2>Rooms</h2>
    <div class="rooms" id="rooms"></div>
    <button class="rooms newroom" id="newroom" style="border:0;background:none;padding:7px 8px;font-size:14px">+ New room</button>
    <div id="nrslot"></div>
    <div class="mates"><h2 style="margin-top:18px">Team</h2><div id="mates"></div></div>
  </nav>
  <main class="room">
    <div class="banner" id="banner"></div>
    <div id="scroll"><div class="feed" id="feed"></div><div class="lives" id="lives"></div></div>
    <div class="composer">
      <div class="pop" id="pop" role="listbox"></div>
      <div class="to" id="to"></div>
      <form class="box" id="form">
        <textarea id="ta" rows="1" placeholder="Message the room" aria-label="Message"></textarea>
        <button class="send" id="send" type="submit">Send</button>
      </form>
      <div class="hint" id="hint">Enter sends. Shift+Enter for a new line. A message with no @mention goes to the lead.</div>
    </div>
  </main>
  <aside class="drawer" id="drawer"><div class="dh"><h2 id="dtitle">Runs</h2><span class="grow"></span><button class="tb" id="dclose">Close</button></div><div class="db" id="dbody"></div></aside>
</div>
<div class="gate" id="gate"><div id="gatebody"></div></div>

<script>
{
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const shq = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
const winq = s => /[\s"&|<>^%()]/.test(s) ? '"' + String(s).replace(/"/g, '""') + '"' : String(s);
const PALETTE = ['#c2410c', '#2563eb', '#7c3aed', '#0f766e', '#be185d', '#4d7c0f', '#0369a1', '#a16207'];
const pad = n => String(n).padStart(2, '0');
const hm = t => new Date(t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
const hms = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const el = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const first = (t, n = 140) => { const s = String(t || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const splitArgs = s => { const out = []; let cur = '', q = null, any = false; for (const ch of String(s)) { if (q) { if (ch === q) q = null; else cur += ch; } else if (ch === '"' || ch === "'") { q = ch; any = true; } else if (/\s/.test(ch)) { if (cur || any) out.push(cur); cur = ''; any = false; } else cur += ch; } if (cur || any) out.push(cur); return out; };
const joinArgs = a => (a || []).map(x => /[\s"']/.test(x) || x === '' ? "'" + x.replace(/'/g, '"') + "'" : x).join(' ');

const DEFAULT_TEAM = () => ({
  version: 1, humanName: '', maxHops: 6, reviewByLead: true, notify: true,
  rooms: [{id: 'general', name: 'general', cwd: '~'}],
  agents: [
    {handle: 'claude', name: 'Claude Code', role: 'lead', mode: 'spawn', enabled: true, program: 'claude',
     args: ['-p', '--output-format', 'stream-json', '--verbose'],
     resumeArgs: ['-p', '--resume', '{session}', '--output-format', 'stream-json', '--verbose'],
     stdin: true, format: 'claude', cwd: '', color: '#c2410c'},
    {handle: 'codex', name: 'Codex', role: 'worker', mode: 'spawn', enabled: true, program: 'codex',
     args: ['exec', '--json', '-'], resumeArgs: ['exec', '--json', 'resume', '{session}', '-'],
     stdin: true, format: 'codex', cwd: '', color: '#2563eb'},
    {handle: 'muse', name: 'Muse Code', role: 'worker', mode: 'spawn', enabled: true, program: 'muse',
     args: ['exec', '--prompt-file', '{prompt_file}'], resumeArgs: [],
     stdin: false, format: 'text', cwd: '', color: '#0f766e'}
  ]
});

const S = {mode: 'boot', D: null, platform: '', home: '', base: '', shell: '/bin/zsh', env: null, team: DEFAULT_TEAM(),
  rooms: new Map(), room: 'general', routed: new Set(), sessions: {}, lastSeen: {}, runs: new Map(), queues: new Map(),
  avail: {}, paused: false, drawer: null, logRun: null, toggles: new Set(), teamMtime: 0, humanName: 'You', trayOff: false, newRoom: false};

const agents = () => S.team.agents;
const agentBy = h => agents().find(a => a.handle === String(h || '').toLowerCase());
const lead = () => agents().find(a => a.role === 'lead' && a.enabled);
const cur = () => S.rooms.get(S.room) || [...S.rooms.values()][0];
const expand = p => { p = String(p || '~').trim() || '~'; if (!S.home) return p; return p === '~' ? S.home : p.startsWith('~/') ? S.home + p.slice(1) : p; };
const tilde = p => S.home && String(p).startsWith(S.home) ? '~' + String(p).slice(S.home.length) : String(p);
const roomPath = id => `${S.base}/rooms/${id}.jsonl`;
const initials = n => { const w = String(n).trim().split(/\s+/); return (w.length > 1 ? w[0][0] + w[1][0] : String(n).slice(0, 2)).toUpperCase(); };

function normalizeTeam(t) {
  const d = DEFAULT_TEAM();
  t = (t && typeof t === 'object') ? t : d;
  t.maxHops = Math.min(50, Math.max(1, parseInt(t.maxHops, 10) || 6));
  t.reviewByLead = t.reviewByLead !== false; t.notify = t.notify !== false;
  t.humanName = typeof t.humanName === 'string' ? t.humanName.slice(0, 40) : '';
  const seen = new Set();
  t.agents = (Array.isArray(t.agents) ? t.agents : d.agents).filter(a => a && /^[a-z0-9][a-z0-9_-]{0,23}$/.test(String(a.handle || '').toLowerCase())).map((a, i) => {
    const h = String(a.handle).toLowerCase();
    if (seen.has(h)) return null; seen.add(h);
    return {handle: h, name: String(a.name || h).slice(0, 40), role: a.role === 'lead' ? 'lead' : 'worker',
      mode: a.mode === 'external' ? 'external' : 'spawn', enabled: a.enabled !== false,
      program: String(a.program || h), args: Array.isArray(a.args) ? a.args.map(String) : [],
      resumeArgs: Array.isArray(a.resumeArgs) ? a.resumeArgs.map(String) : [], stdin: a.stdin !== false,
      format: ['claude', 'codex', 'text'].includes(a.format) ? a.format : 'text', cwd: String(a.cwd || ''),
      color: /^#[0-9a-f]{3,8}$/i.test(a.color || '') ? a.color : PALETTE[i % PALETTE.length]};
  }).filter(Boolean);
  let leads = 0; for (const a of t.agents) if (a.role === 'lead' && leads++) a.role = 'worker';
  t.agents.forEach(a => { a.av = initials(a.name); });
  const rs = new Set();
  t.rooms = (Array.isArray(t.rooms) ? t.rooms : d.rooms).filter(r => r && /^[a-z0-9][a-z0-9_-]{0,39}$/.test(r.id || '') && !rs.has(r.id) && rs.add(r.id))
    .map(r => ({id: r.id, name: String(r.name || r.id).slice(0, 40), cwd: String(r.cwd || '~')}));
  if (!t.rooms.length) t.rooms = d.rooms;
  return t;
}

/* ---------- rendering ---------- */
function md(t) {
  return String(t).split('```').map((p, i) => i % 2 ? `<pre><code>${esc(p.replace(/^[\w+-]*\n/, ''))}</code></pre>` : inline(p)).join('');
}
function inline(p) {
  let h = esc(p);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');

function parseMsg(line) {
  try {
    const m = JSON.parse(line);
    if (!m || typeof m.id !== 'string' || typeof m.text !== 'string') return null;
    return {id: m.id.slice(0, 80), ts: Number(m.ts) || 0, from: String(m.from || 'human').toLowerCase().slice(0, 40),
      kind: ['human', 'agent', 'system'].includes(m.kind) ? m.kind : (m.from && m.from !== 'human' ? 'agent' : 'human'),
      text: m.text, hop: Number(m.hop) || 0, replyTo: m.replyTo ? String(m.replyTo) : '', run: m.run ? String(m.run).slice(0, 40) : '',
      action: m.action === 'continue' ? 'continue' : '', ref: m.ref ? String(m.ref) : ''};
  } catch { return null; }
}
async function readRoom(room, seed) {
  const p = roomPath(room.id);
  let st = await S.D.fs.stat(p).catch(() => null);
  if (!st) { await S.D.fs.writeFile(p, ''); st = await S.D.fs.stat(p); }
  if (!seed && st.size === room.size && st.mtimeMs === room.mtime) return;
  let txt;
  try { txt = await S.D.fs.readFile(p, 'utf8'); } catch (e) { banner(`Can't read #${room.name}: ${e.message}`); return; }
  room.size = st.size; room.mtime = st.mtimeMs;
  const msgs = txt.split('\n').map(parseMsg).filter(Boolean);
  const ids = new Set(msgs.map(m => m.id));
  const pending = room.messages.filter(m => m._local && !ids.has(m.id));
  const fresh = msgs.filter(m => !room.ids.has(m.id));
  room.messages = msgs.concat(pending); room.ids = new Set(room.messages.map(m => m.id));
  if (seed) { msgs.forEach(m => S.routed.add(m.id)); return; }
  for (const m of fresh) {
    if (S.routed.has(m.id)) continue;
    if (m.kind !== 'system') { bumpUnread(room, m); route(m, room); }
    else S.routed.add(m.id);
  }
  if (fresh.length) { renderRail(); if (room.id === S.room) renderFeed(); }
}
async function post(room, m) {
  m = {id: uid(), ts: Date.now(), hop: 0, ...m};
  const disk = {id: m.id, ts: m.ts, from: m.from, kind: m.kind, text: m.text, hop: m.hop};
  for (const k of ['replyTo', 'run', 'action', 'ref']) if (m[k]) disk[k] = m[k];
  S.routed.add(m.id); room.ids.add(m.id); room.messages.push({...disk, _local: true});
  if (room.id === S.room) renderFeed();
  if (S.mode === 'live') await S.D.fs.appendFile(roomPath(room.id), JSON.stringify(disk) + '\n').catch(e => banner(`Couldn't write to #${room.name}: ${e.message}`));

}
const sys = (room, text, extra = {}) => post(room, {from: 'system', kind: 'system', text, ...extra});

function mentions(text) {
  const out = [];
  for (const m of String(text).replace(/```[\s\S]*?```/g, ' ').matchAll(/(^|[^\w@./])@([a-z0-9][\w-]*)(?![\w-]|['’]s\b)/gi)) { const a = agentBy(m[2]); if (a && !out.includes(a.handle)) out.push(a.handle); }
  return out;
}
function route(m, room, force) {
  if (!force && S.routed.has(m.id) && !m._fresh) return;
  S.routed.add(m.id);
  if (S.mode !== 'live' || m.kind === 'system') return;
  let targets = mentions(m.text);
  if (m.kind === 'human') { if (!targets.length) { const L = lead(); if (L) targets = [L.handle]; else return sys(room, 'No lead is set, so an untagged message wakes nobody. Pick a lead in Team, or @mention someone.'); } }
  else {
    targets = targets.filter(h => h !== m.from);
    const L = lead();
    if (!targets.length && S.team.reviewByLead && L && m.from !== L.handle && m.replyTo === L.handle) targets = [L.handle];
    if (targets.length && !force && m.hop >= S.team.maxHops) return sys(room, `Loop guard: paused after ${m.hop} handoffs. ${targets.map(t => '@' + t).join(', ')} not woken.`, {action: 'continue', ref: m.id});
  }
  for (const h of targets) {
    const a = agentBy(h);
    if (!a || a.mode === 'external') continue;
    if (!a.enabled) { sys(room, `@${a.handle} is off the team right now. Turn it on in Team to wake it.`); continue; }
    enqueue(a, room, {id: m.id, from: m.kind === 'human' ? 'human' : m.from, hop: force ? 0 : m.hop});

function enqueue(a, room, trig) {

  if (job) { job.triggers.push(trig); job.hop = Math.max(job.hop, trig.hop); }

  for (const [key, q] of S.queues) {
    if (running >= 6) break;
    if (q.some(j => j.started)) continue;
    const job = q[0]; if (!job) continue;
    job.started = true; running++;
    runJob(job).catch(e => console.error(e)).finally(() => { q.splice(q.indexOf(job), 1); if (!q.length) S.queues.delete(key); pump(); renderRail(); renderHeader(); renderLives(); setTray(); });

}

function buildPrompt(a, room, job, resumed) {

  const since = resumed ? (S.lastSeen[room.id]?.[a.handle] || 0) : 0;
  let msgs = room.messages.filter(m => m.kind !== 'system' && m.ts > since && !(resumed && m.from === a.handle));
  msgs = msgs.slice(resumed ? -60 : -30);

  const woke = job.triggers.map(t => t.from === 'human' ? me : '@' + t.from);
  const team = agents().filter(x => x.enabled).map(x => `- @${x.handle}: ${x.name}${x.role === 'lead' ? ' (lead)' : ''}${x.handle === a.handle ? ' (you)' : ''}`).join('\n');
  const roleText = a.role === 'lead'
    ? `You lead this room. Answer ${me} directly when you can. When there is real work, split it into concrete scopes and hand each to an available teammate by @mentioning them with a self-contained brief: what to do, where, and what "done" looks like. Review what comes back${S.team.reviewByLead ? ' (you are woken automatically when a teammate you assigned reports back)' : ''} and integrate it. Say plainly what is finished and what is not.`
    : `When you finish work someone handed you, report what you changed, how you checked it, and anything left open.${L && L.handle !== a.handle ? ` @${L.handle} reviews it.` : ''}`;
  return `You are @${a.handle} (${a.name}) in the #${room.name} room of a small team: ${me} (the human) and AI teammates.
Team:
${team}
Working directory: ${tilde(expand(a.cwd || room.cwd))}

How the room works:
- Your final reply is posted to the room as you, word for word. Keep it to what the room needs: results, decisions, questions, blockers.
- An @mention wakes that teammate and starts them on a run. Only mention someone when you need them to act, and never mention yourself. To refer to a teammate without waking them, write their name without the @.
- Teammates see the room, not your private context, so put everything they need in the message.
${roleText}

    let t = await readJSON(S.base + '/team.json');
    S.team = normalizeTeam(t || DEFAULT_TEAM());
    if (!t) { await saveTeam(); D.window.place({anchor: 'center', width: 1180, height: 780}).catch(() => {}); } else S.teamMtime = (await D.fs.stat(S.base + '/team.json')).mtimeMs;
    S.humanName = S.team.humanName || (user ? user[0].toUpperCase() + user.slice(1) : 'You');
    const st = await readJSON(S.base + '/state.json') || {};
    S.sessions = st.sessions && typeof st.sessions === 'object' ? st.sessions : {};
    S.lastSeen = st.lastSeen && typeof st.lastSeen === 'object' ? st.lastSeen : {};
    ensureRooms();
    for (const r of S.rooms.values()) await readRoom(r, true);
  } catch (e) {
    document.body.classList.remove('booting');
    banner(`Agent Team couldn't open ~/.agent-team: ${e.message}`); return;
  }
  document.body.classList.remove('booting');
  renderAll();
  $('#scroll').scrollTop = 1e9;
  S.env = await captureEnv();
  checkAvail(); setTray();
  setInterval(poll, 1200);
}
async function boot() {
  let D = null;
  try { D = await window.claude?.use?.('desktop'); } catch {}
  S.D = D;
  if (!D?.fs) return preview(D);
  D.app.dock.setIcon(drawIcon()).catch(() => {});
  D.window.setOptions({titleBarStyle: 'hiddenInset', dragHeight: 48, minWidth: 760, minHeight: 520}).catch(() => {});
  S.platform = await D.os.platform().catch(() => 'darwin');
  document.documentElement.classList.add('desk', 'os-' + S.platform);
  const st = await D.permissions.state().catch(() => ({}));
  document.body.classList.remove('booting');
  if (st['full-access'] === 'granted') return start();
  renderAll(); gate(st['full-access'] || 'prompt');
}

/* ---------- events ---------- */
async function send() {
  const ta = $('#ta'), raw = ta.value.trim(), room = cur();
  if (!raw || S.mode !== 'live' || !room) return;
  const add = [...S.toggles].filter(h => !mentions(raw).includes(h));
  const text = (add.length ? add.map(h => '@' + h).join(' ') + ' ' : '') + raw;
  ta.value = ''; S.toggles.clear(); grow(); renderTo(); closePop();
  const m = await post(room, {from: 'human', kind: 'human', text, hop: 0});
  route({...m, _fresh: true}, room);
  $('#scroll').scrollTop = 1e9;
}
function grow() { const ta = $('#ta'); ta.style.height = 'auto'; ta.style.height = Math.min(220, ta.scrollHeight) + 'px'; }
let popSel = 0, popItems = [];
function closePop() { $('#pop').classList.remove('open'); popItems = []; }
function openPop() {
  const ta = $('#ta'), m = /(^|\s)@([\w-]*)$/.exec(ta.value.slice(0, ta.selectionStart));
  if (!m) return closePop();
  popItems = agents().filter(a => a.enabled && a.handle.startsWith(m[2].toLowerCase()));
  if (!popItems.length) return closePop();
  popSel = Math.min(popSel, popItems.length - 1);
  $('#pop').innerHTML = popItems.map((a, i) => `<button type="button" role="option" data-pick-at="${esc(a.handle)}" aria-selected="${i === popSel}"><span class="av" style="--c:${a.color};width:22px;height:22px;font-size:9px">${esc(a.av)}</span>@${esc(a.handle)} <small style="color:var(--mute)">${esc(a.name)}</small></button>`).join('');
  $('#pop').classList.add('open');
}
function pickAt(h) {
  const ta = $('#ta'), pos = ta.selectionStart, before = ta.value.slice(0, pos).replace(/@([\w-]*)$/, '@' + h + ' ');
  ta.value = before + ta.value.slice(pos); ta.selectionStart = ta.selectionEnd = before.length; ta.focus(); closePop();
}

$('#form').addEventListener('submit', e => { e.preventDefault(); send(); });
$('#ta').addEventListener('input', () => { grow(); openPop(); });
$('#ta').addEventListener('keydown', e => {
  if ($('#pop').classList.contains('open') && popItems.length) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); popSel = (popSel + (e.key === 'ArrowDown' ? 1 : -1) + popItems.length) % popItems.length; openPop(); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickAt(popItems[popSel].handle); return; }
    if (e.key === 'Escape') { closePop(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.room) { S.room = d.room; const r = cur(); r.unread = 0; badge(); S.logRun = null; renderAll(); $('#scroll').scrollTop = 1e9; }
  else if (d.to) { S.toggles.has(d.to) ? S.toggles.delete(d.to) : S.toggles.add(d.to); renderTo(); $('#ta').focus(); }
  else if (d.pickAt) pickAt(d.pickAt);
  else if (d.log) { await loadRun(d.log); S.logRun = d.log; S.drawer = 'log'; renderHeader(); renderDrawer(); }
  else if (d.pick) { S.logRun = d.pick; renderLog(); }
  else if (d.stop) stopRun(d.stop);
  else if (d.continue) { const room = cur(), m = room.messages.find(x => x.id === d.continue); if (m) { route(m, room, true); t.disabled = true; t.textContent = 'Continued'; } }
  else if (d.reveal) S.D.shell.showItemInFolder(`${S.base}/runs/${d.reveal}/prompt.md`).catch(() => {});
  else if (d.remove != null) t.closest('fieldset')?.remove();
  else if (t.id === 'addmate') { const n = document.querySelectorAll('#teamform fieldset[data-i]').length; t.parentElement.insertAdjacentHTML('beforebegin', agentFields({handle: 'agent' + (n + 1), name: 'New teammate', role: 'worker', mode: 'spawn', enabled: true, program: '', args: [], resumeArgs: [], stdin: true, format: 'text', cwd: ''}, 100 + n)); }
  else if (t.id === 'opendata') S.D.shell.openPath(S.base).catch(() => {});
  else if (t.id === 'pause') togglePause();
  else if (t.id === 'logbtn') { S.drawer = S.drawer === 'log' ? null : 'log'; renderHeader(); renderDrawer(); }
  else if (t.id === 'teambtn') { S.drawer = S.drawer === 'team' ? null : 'team'; renderHeader(); renderDrawer(); }
  else if (t.id === 'dclose') { S.drawer = null; renderHeader(); renderDrawer(); }
  else if (t.id === 'folder' && S.mode === 'live') S.D.shell.openPath(expand(cur().cwd)).catch(err => banner(`Can't open ${cur().cwd}: ${err.message}`));
  else if (t.id === 'newroom') { S.newRoom = !S.newRoom; $('#nrslot').innerHTML = S.newRoom ? `<form class="nr" id="nrform"><label>Room name<input type="text" name="name" placeholder="counterpart" required></label><label>Folder agents work in<input type="text" name="cwd" class="mono" value="~/"></label><div class="actions"><button class="tb primary">Create</button></div><p class="err" id="nrerr"></p></form>` : ''; $('#nrform input')?.focus(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'teamform') {
    e.preventDefault(); if (S.mode !== 'live') return;
    const t = readTeamForm(), err = $('#teamerr');
    const bad = t.agents.find(a => !/^[a-z0-9][a-z0-9_-]{0,23}$/.test(a.handle) || (a.mode === 'spawn' && !a.program));
    if (bad) { err.textContent = `${bad.name || 'A teammate'} needs a handle (letters, digits, - or _) and a command.`; return; }
    if (new Set(t.agents.map(a => a.handle)).size !== t.agents.length) { err.textContent = 'Two teammates share a handle.'; return; }
    if (t.agents.filter(a => a.role === 'lead').length > 1) { err.textContent = 'Only one lead, please.'; return; }
    const room = t.rooms.find(r => r.id === S.room);
    if (room && !(await S.D.fs.exists(expand(room.cwd)).catch(() => false))) { err.textContent = `${room.cwd} doesn't exist.`; return; }
    S.team = normalizeTeam(t); S.humanName = S.team.humanName || S.humanName;
    try { await saveTeam(); } catch (x) { err.textContent = x.message; return; }
    ensureRooms(); S.drawer = null; renderAll(); checkAvail();
  } else if (e.target.id === 'nrform') {
    e.preventDefault(); if (S.mode !== 'live') return;
    const f = e.target, name = f.name.value.trim(), cwd = f.cwd.value.trim() || '~';
    const id = name.toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    if (!id) { $('#nrerr').textContent = 'Give it a name.'; return; }
    if (S.rooms.has(id)) { $('#nrerr').textContent = 'That room exists.'; return; }
    if (!(await S.D.fs.exists(expand(cwd)).catch(() => false))) { $('#nrerr').textContent = `${cwd} doesn't exist.`; return; }
    S.team.rooms.push({id, name: id, cwd}); await saveTeam(); ensureRooms();
    await readRoom(S.rooms.get(id), true); S.room = id; S.newRoom = false; $('#nrslot').innerHTML = ''; renderAll();
  }
});
window.addEventListener('focus', () => { const r = cur(); if (r?.unread) { r.unread = 0; renderRail(); } badge(); });
setInterval(() => { for (const n of document.querySelectorAll('time.el')) n.textContent = el(Date.now() - +n.dataset.start); }, 1000);

boot();
}
</script>
