<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Team</title>
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["full-access", "notifications", "menu-bar"]}</script>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a team chat you already know how to use, built from Mac parts. Quiet chrome, the bots do the talking.
   IDEA: a chat workspace with an office next door. Channels on the left, conversation in the middle, the Office Bot floor on the side.
   PICTURE: the bots' own little characters, the same ones that sit at desks in the office, talking in a group chat that folds into one summary.
   COLOUR and TYPE: system greys and system blue, translucent sidebar, white panels; the system font (SF on a Mac, Inter elsewhere).
   LAYOUT: title bar with search, workspace rail, sidebar, messages, a resizable office pane; settings as a System Settings style sheet. */
:root{color-scheme:light dark;
--frame:light-dark(#e8e8ed,#262629);--panel:light-dark(#ffffff,#1e1e20);--panel2:light-dark(#f5f5f7,#232326);
--t1:light-dark(#1d1d1f,#f5f5f7);--t2:light-dark(#6e6e73,#a1a1a6);--t3:light-dark(#a1a1a6,#6e6e73);
--sep:light-dark(rgba(60,60,67,.13),rgba(235,235,245,.12));--sep2:light-dark(rgba(60,60,67,.22),rgba(235,235,245,.2));
--fill:light-dark(rgba(120,120,128,.12),rgba(120,120,128,.24));--fill2:light-dark(rgba(120,120,128,.07),rgba(120,120,128,.16));
--accent:light-dark(#007aff,#0a84ff);--green:light-dark(#34c759,#30d158);--orange:light-dark(#ff9500,#ff9f0a);--red:light-dark(#ff3b30,#ff453a);
--bubble:light-dark(#e9e9eb,#2c2c2e);--hover:light-dark(rgba(0,0,0,.035),rgba(255,255,255,.04));
--sh:0 0 0 .5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",monospace}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--t1);font:14px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
html.vib body{background:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:default}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-radius:6px}
code,pre,.mono{font-family:var(--mono)}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.grow{flex:1}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

#app{display:grid;grid-template-columns:70px 252px minmax(0,1fr) auto auto;grid-template-rows:44px minmax(0,1fr);height:100vh}
#app.office-full{grid-template-columns:70px 252px 0 0 minmax(0,1fr)}
#app.office-full .room{display:none}
.wsrail{grid-column:1;grid-row:2}.sidebar{grid-column:2;grid-row:2}.room{grid-column:3;grid-row:2}.divider{grid-column:4;grid-row:2}.pane{grid-column:5;grid-row:2}

/* title bar */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;-webkit-app-region:drag;app-region:drag;user-select:none}
.desk.os-darwin .topbar{padding-left:82px}
.topbar button,.topbar input{-webkit-app-region:no-drag;app-region:no-drag}
.search{flex:0 1 560px;margin:0 auto;display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:7px;background:var(--fill);color:var(--t2)}
.search input{flex:1;border:0;background:none;outline:none;font-size:13px;color:var(--t1)}
.search input::placeholder{color:var(--t2)}
.tbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:0;border-radius:7px;background:none;color:var(--t2);font-size:13px}
.tbtn:hover{background:var(--fill)}
.tbtn[aria-pressed=true]{background:var(--fill);color:var(--t1)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.tbtn.busy .live-dot{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}

/* workspace rail */
.wsrail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 12px}
.ws{width:38px;height:38px;border-radius:10px;background:linear-gradient(160deg,#3a3a3c,#1c1c1e);display:grid;place-items:center;margin-bottom:10px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.ws svg{width:24px;height:24px}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--t2);font-size:10.5px;font-weight:500;width:60px;padding:0}
.rb .tile{width:36px;height:32px;border-radius:9px;display:grid;place-items:center;position:relative}
.rb .tile .ic{width:19px;height:19px}
.rb:hover .tile{background:var(--fill)}
.rb[aria-pressed=true]{color:var(--t1)}.rb[aria-pressed=true] .tile{background:var(--fill)}
.rb .pip{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.me{width:32px;height:32px;border-radius:9px;background:#5e5ce6;color:#fff;font-weight:600;font-size:12px;display:grid;place-items:center;margin-top:8px;position:relative}
.me::after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--frame)}

/* sidebar */
.sidebar{display:flex;flex-direction:column;min-height:0;padding:0 8px 0 2px}
.sb-head{display:flex;align-items:center;gap:6px;height:44px;padding:0 6px 0 10px}
.ws-name{display:flex;align-items:center;gap:5px;border:0;background:none;font-size:17px;font-weight:700;letter-spacing:-.01em;padding:4px 6px;border-radius:7px;margin-left:-6px;white-space:nowrap}
.ws-name:hover{background:var(--fill)}
.ws-name .ic{width:12px;height:12px;color:var(--t2)}
.icbtn{width:30px;height:30px;border:0;border-radius:8px;background:none;display:grid;place-items:center;color:var(--t2)}
.icbtn:hover{background:var(--fill);color:var(--t1)}
.sb-scroll{flex:1;overflow:auto;padding:2px 0 16px;scrollbar-width:thin}
.statusrow{display:flex;align-items:center;gap:8px;margin:2px 4px 10px;padding:8px 10px;border-radius:10px;background:var(--fill2);font-size:12.5px;color:var(--t2)}
.statusrow b{color:var(--t1);font-weight:600}
.sec{margin-bottom:12px}
.sec-h{display:flex;align-items:center;gap:4px;width:100%;border:0;background:none;color:var(--t2);font-size:12px;font-weight:600;padding:4px 6px;border-radius:6px}
.sec-h:hover{color:var(--t1)}
.sec-h .ic{width:11px;height:11px;transition:transform .15s}
.sec.closed .sec-h .ic{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.row{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:0 8px;height:30px;border-radius:7px;font-size:14px;color:var(--t1);white-space:nowrap}
.row:hover{background:var(--hover)}
.row[aria-current=true]{background:var(--accent);color:#fff}
.row[aria-current=true] .hash,.row[aria-current=true] small{color:rgba(255,255,255,.8)}
.row .hash{width:16px;text-align:center;color:var(--t2);font-weight:500}
.row .nm{overflow:hidden;text-overflow:ellipsis}
.row.unread .nm{font-weight:700}
.row .badge{margin-left:auto;min-width:20px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.row small{margin-left:auto;color:var(--t3);font-size:11.5px}
.row.add{color:var(--t2)}
.row .mini{width:20px;height:20px;border-radius:6px;flex:none;position:relative}
.row .mini svg{width:20px;height:20px;display:block;border-radius:6px}
.pres{position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px var(--frame);background:var(--t3)}
.pres.working{background:var(--green)}.pres.needs-you{background:var(--orange)}.pres.stuck{background:var(--red)}.pres.finished{background:var(--accent)}
.row[aria-current=true] .pres{box-shadow:0 0 0 2px var(--accent)}
.row[data-view][aria-current=true]{background:var(--fill);color:var(--t1)}
form.nr{display:grid;gap:7px;padding:10px;margin:4px 2px;background:var(--panel);border-radius:10px;box-shadow:var(--sh)}
.actlist .ai{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:8px}
.actlist .ai:hover{background:var(--hover)}
.actlist .ai small{color:var(--t2);display:block;font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.actlist .ai b{font-size:13px}

/* panels */
.room,.pane{background:var(--panel);border-radius:12px 0 0 0;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane{border-radius:0;box-shadow:none;border-left:.5px solid var(--sep2)}
#app.office-full .pane{border-radius:12px 0 0 0;box-shadow:var(--sh);border-left:0}
.divider{width:0;cursor:col-resize;position:relative;z-index:3}
.divider::after{content:"";position:absolute;inset:0 -4px}
.chead{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 20px;border-bottom:.5px solid var(--sep2)}
.chead h1{flex:none;margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:4px;white-space:nowrap}
.chead h1 .hash{color:var(--t2);font-weight:500}
.chead .topic{font-size:12.5px;color:var(--t2);border:0;background:none;padding:3px 6px;border-radius:6px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.chead .topic:hover{background:var(--fill);color:var(--t1)}
.chead .topic .ic{width:13px;height:13px}
.stack{display:flex;align-items:center}
.stack .av{margin-left:-6px;box-shadow:0 0 0 2px var(--panel)}
.stack .av:first-child{margin-left:0}
.members{display:flex;align-items:center;gap:7px;border:.5px solid var(--sep2);background:none;border-radius:8px;padding:3px 9px 3px 5px;font-size:13px;color:var(--t2)}
.members:hover{background:var(--fill2)}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:7px;border:.5px solid var(--sep2);background:var(--panel);color:var(--t1);font-size:13px;font-weight:500;box-shadow:0 .5px 1px rgba(0,0,0,.06);white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn:active{background:var(--fill)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--red)}
.btn[aria-pressed=true]{background:var(--fill);box-shadow:none}
.btn:disabled{opacity:.45}
.btn .ic{width:14px;height:14px}

.banner{display:none;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-bottom:.5px solid var(--sep2);font-size:13px}
.banner.show{display:flex}
#scroll{flex:1;min-height:0;overflow:auto;padding:10px 0 6px;overscroll-behavior:contain}

/* messages */
.m{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:6px 20px 6px 20px}
.m:hover{background:var(--hover)}
.m.cont{padding-top:1px;padding-bottom:1px}
.m.cont .av{visibility:hidden;height:0}
.m.cont .mt{position:absolute;left:20px;width:36px;text-align:right;font-size:10.5px;color:var(--t3);top:5px;visibility:hidden}
.m.cont:hover .mt{visibility:visible}
.mh{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;line-height:1.3}
.mh b{font-size:15px;font-weight:700}
.mh time,.mh .via{font-size:12px;color:var(--t2)}
.tag{font-size:10.5px;font-weight:600;color:var(--t2);background:var(--fill);border-radius:4px;padding:1px 5px;line-height:14px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.47;margin-top:1px}
.txt code{font-size:12.5px;background:var(--fill);border:.5px solid var(--sep);padding:1px 4px;border-radius:4px;color:light-dark(#c41a16,#ff8a80)}
.txt pre{white-space:pre;overflow:auto;background:var(--panel2);border:.5px solid var(--sep2);padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.5;margin:6px 0}
.txt pre code{background:none;border:0;padding:0;color:inherit}
.txt a{color:var(--accent);text-decoration:none}.txt a:hover{text-decoration:underline}
.at{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:4px;padding:0 2px;font-weight:500}
.tools{position:absolute;right:16px;top:-14px;display:none;background:var(--panel);border-radius:9px;box-shadow:var(--sh);padding:2px;z-index:2}
.m:hover .tools,.bub:hover .tools{display:flex}
.tools button{height:28px;min-width:30px;padding:0 7px;border:0;background:none;border-radius:7px;color:var(--t2);font-size:12.5px;display:flex;align-items:center;gap:4px}
.tools button:hover{background:var(--fill);color:var(--t1)}
.day{position:sticky;top:0;z-index:1;display:flex;justify-content:center;margin:10px 0 4px;pointer-events:none}
.day::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:.5px solid var(--sep2)}
.day span{position:relative;background:var(--panel);border:.5px solid var(--sep2);border-radius:13px;padding:3px 12px;font-size:12.5px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sys{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--t2);font-size:12.5px;padding:6px 20px;text-align:center}
.lnk{border:0;background:none;padding:0;font-size:12.5px;color:var(--accent)}
.lnk:hover{text-decoration:underline}
.sample{font-size:12px;color:var(--t2);text-align:center;margin:2px 0 4px}
.empty{max-width:480px;margin:12vh auto 0;padding:0 24px;text-align:center;color:var(--t2)}
.empty .hero{width:76px;height:76px;margin:0 auto 14px;display:block}
.empty h3{color:var(--t1);font-size:22px;margin:0 0 8px;letter-spacing:-.015em}
.empty p{margin:0 0 8px;font-size:14px}
.empty .actions{justify-content:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* avatars */
.av{width:36px;height:36px;border-radius:9px;flex:none;display:block;overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.av.sm{width:24px;height:24px;border-radius:50%}
.av.xs{width:20px;height:20px;border-radius:50%}
.av.human{background:#5e5ce6;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.av.sm.human{font-size:9.5px}

/* bot conversations */
.chain{margin:4px 20px 6px 66px;border-radius:14px;background:var(--panel2);border:.5px solid var(--sep);padding:10px 14px 12px}
.ch-head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2);margin-bottom:8px}
.ch-head b{color:var(--t1);font-weight:600}
.bub{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;margin:7px 0}
.bub .bn{font-size:11.5px;color:var(--t2);margin:0 0 2px 10px}
.bub .bn b{color:var(--t1);font-weight:600}
.bubble{display:inline-block;max-width:min(100%,620px);background:var(--bubble);border-radius:18px;padding:7px 12px;font-size:14px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.bubble code{font-size:12px;background:rgba(0,0,0,.06);padding:0 3px;border-radius:4px}
.bubble pre{white-space:pre-wrap;font-size:12px;margin:4px 0}
.bub.typing .bubble{display:inline-flex;align-items:center;gap:10px;padding:9px 13px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--t2);opacity:.35;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{40%{opacity:1;transform:translateY(-2px)}}
.bub .act{font-family:var(--mono);font-size:11.5px;color:var(--t2);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub .el{font-size:11.5px;color:var(--t3)}
.bub .tools{top:-10px;right:0}
.note{font-size:12px;color:var(--t2);margin:6px 0 6px 32px}
.cap{display:flex;align-items:center;gap:10px;margin:2px 20px 2px 66px;border:.5px solid var(--sep2);background:var(--panel);border-radius:12px;padding:6px 12px 6px 8px;font-size:13px;color:var(--t2);width:max-content;max-width:calc(100% - 86px)}
.cap:hover{background:var(--panel2)}
.cap b{color:var(--t1);font-weight:600}
.cap .ic{width:12px;height:12px;transition:transform .2s}
.cap[aria-expanded=true] .ic{transform:rotate(90deg)}
.chain.folded{margin-top:2px}
.summary-tag{font-size:10.5px;font-weight:600;color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent);border-radius:4px;padding:1px 5px}

/* composer */
.composer{padding:4px 20px 16px;position:relative}
.box{border:.5px solid var(--sep2);border-radius:12px;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.box:focus-within{border-color:color-mix(in srgb,var(--t1) 35%,var(--sep2));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.fmt{display:flex;gap:2px;padding:5px 6px 0;border-bottom:0}
.fmt button{width:28px;height:26px;border:0;background:none;border-radius:6px;color:var(--t2);display:grid;place-items:center;font-size:13px}
.fmt button:hover{background:var(--fill);color:var(--t1)}
.fmt .ic{width:15px;height:15px}
.fmt .sp{width:.5px;background:var(--sep2);margin:4px 4px}
#ta{display:block;width:100%;border:0;background:none;resize:none;outline:none;font-size:15px;line-height:1.45;max-height:260px;padding:6px 14px 2px}
#ta::placeholder{color:var(--t3)}
.cbar{display:flex;align-items:center;gap:4px;padding:4px 8px 7px}
.cbar .chip{display:flex;align-items:center;gap:5px;height:24px;border-radius:12px;border:.5px solid var(--sep2);background:none;padding:0 8px 0 3px;font-size:12px;color:var(--t2)}
.cbar .chip[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:transparent;color:var(--accent)}
.send{width:30px;height:30px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;margin-left:auto}
.send:disabled{background:var(--fill);color:var(--t3)}
.send .ic{width:16px;height:16px;stroke-width:2.2}
.hint{font-size:11.5px;color:var(--t3);margin:5px 4px 0;text-align:right}
.pop{position:absolute;bottom:calc(100% - 6px);left:20px;background:var(--panel);border-radius:12px;box-shadow:0 0 0 .5px var(--sep2),0 12px 32px -8px rgba(0,0,0,.3);padding:5px;min-width:270px;display:none;z-index:5}
.pop.open{display:block}
.pop button{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:6px 8px;border-radius:7px;text-align:left}
.pop button[aria-selected=true]{background:var(--accent);color:#fff}.pop button[aria-selected=true] small{color:rgba(255,255,255,.8)}
.pop small{color:var(--t2)}

/* side pane */
.pane-head{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;border-bottom:.5px solid var(--sep2)}
.seg{display:inline-flex;background:var(--fill);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:0 12px;height:24px;font-size:12.5px;font-weight:500;color:var(--t1)}
.seg button[aria-pressed=true]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme=dark] .seg button[aria-pressed=true]{background:#636366}
.pane-body{flex:1;min-height:0;position:relative}
.runsv,.searchv{position:absolute;inset:0;overflow:auto;padding:14px 14px 28px}
.runs{display:grid;gap:6px}
.runrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:var(--panel2);border-radius:10px;padding:8px 10px;text-align:left;font-size:13px}
.runrow[aria-current=true]{box-shadow:0 0 0 2px var(--accent)}
.runrow small{color:var(--t2)}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;white-space:nowrap;background:var(--fill);color:var(--t2)}
.pill.running,.pill.working{background:color-mix(in srgb,var(--green) 16%,transparent);color:light-dark(#248a3d,#30d158)}
.pill.done,.pill.ok{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pill.failed,.pill.stopped,.pill.no{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.runhead{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;margin-bottom:12px}
.runhead b{font-size:15px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:12.5px;margin:6px 0 0}
.facts dt{color:var(--t2)}.facts dd{margin:0;overflow-wrap:anywhere}
.ev{display:grid;grid-template-columns:58px 52px minmax(0,1fr);gap:8px;font-size:12px;padding:5px 0;border-bottom:.5px solid var(--sep)}
.ev time{color:var(--t2);font-variant-numeric:tabular-nums}.ev .k{color:var(--t2);font-weight:500}
.ev .x{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px}
.ev.k-text .x{font-family:var(--font);font-size:13px}
.ev.k-error .k,.ev.k-stderr .k{color:var(--red)}
details{margin:8px 0}summary{font-size:13px;font-weight:500}
details pre{white-space:pre-wrap;font-size:11.5px;background:var(--panel2);padding:10px 12px;border-radius:8px;max-height:320px;overflow:auto}
.muted{font-size:12.5px;color:var(--t2);line-height:1.5}
.err{color:var(--red);font-size:12.5px}
.hit{display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:9px}
.hit:hover{background:var(--hover)}
.hit small{color:var(--t2)}

.o-act{display:flex;gap:8px;padding:2px 0}

.office .ab{position:relative;width:24px;height:24px;pointer-events:auto;cursor:pointer}

@container office (max-width:767px){
  .o-hint,.o-zoom{display:none}
  .office .ab.s-working .ab-pill,.office .ab.s-finished .ab-pill{display:none!important}
  .office .ab-pill{font-size:11px;padding:4px 9px;max-width:160px}
  .o-brand{max-width:calc(100cqw - 100px)}.o-bt{flex-direction:column;gap:0}
  .o-tc{top:62px;max-width:calc(100cqw - 16px)}
  .o-counts{gap:9px;padding:7px 10px;font-size:11px}

}

/* settings: System Settings style */

.sw{position:relative;display:inline-block;width:38px;height:22px;flex:none}

.route{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--t2);margin-top:2px}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}

.kind{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;letter-spacing:.02em;flex:none}
.sfoot{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:.5px solid var(--sep);background:var(--panel)}

.booting #app{visibility:hidden}

</style>

<script>
{
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const shq = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
const winq = s => /[\s"&|<>^%()]/.test(s) ? '"' + String(s).replace(/"/g, '""') + '"' : String(s);
const PALETTE = ['#c2410c', '#16181f', '#6d4aff', '#0e8c7e', '#d6336c', '#1f7a8c', '#8a5a00', '#4b5563'];
const pad = n => String(n).padStart(2, '0');
const hm = t => new Date(t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
const hms = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const el = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const first = (t, n = 140) => { const s = String(t || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const splitArgs = s => { const out = []; let cur = '', q = null, any = false; for (const ch of String(s)) { if (q) { if (ch === q) q = null; else cur += ch; } else if (ch === '"' || ch === "'") { q = ch; any = true; } else if (/\s/.test(ch)) { if (cur || any) out.push(cur); cur = ''; any = false; } else cur += ch; } if (cur || any) out.push(cur); return out; };
const joinArgs = a => (a || []).map(x => /[\s"']/.test(x) || x === '' ? "'" + x.replace(/'/g, '"') + "'" : x).join(' ');
const clone = v => JSON.parse(JSON.stringify(v));
const KEY = '\u0000KEY\u0000';

/* ---------- catalog: CLIs and providers ---------- */
const CLIS = {
  claude: {label: 'Claude Code', preset: {handle: 'claude', name: 'Claude Code', program: 'claude', format: 'claude', stdin: true, modelFlag: '--model',
    args: ['-p', '--output-format', 'stream-json', '--verbose'], resumeArgs: ['-p', '--resume', '{session}', '--output-format', 'stream-json', '--verbose']},
    plan: 'Claude Pro or Max', login: 'run `claude` and use /login'},
  codex: {label: 'Codex', preset: {handle: 'codex', name: 'Codex', program: 'codex', format: 'codex', stdin: true, modelFlag: '-m',
    args: ['exec', '--json', '-'], resumeArgs: ['exec', '--json', 'resume', '{session}', '-']},
    plan: 'ChatGPT plan', login: 'run `codex login`'},
  gemini: {label: 'Gemini CLI', preset: {handle: 'gemini', name: 'Gemini CLI', program: 'gemini', format: 'gemini', stdin: true, modelFlag: '-m',
    args: ['--output-format', 'json'], resumeArgs: []},
    plan: 'Google account', login: 'run `gemini` and sign in'},
  muse: {label: 'Muse Code', preset: {handle: 'muse', name: 'Muse Code', program: 'muse', format: 'text', stdin: false, modelFlag: '',
    args: ['exec', '--prompt-file', '{prompt_file}'], resumeArgs: []},
    plan: 'Meta account', login: 'run `muse` and sign in'},
  custom: {label: 'Other CLI', preset: {handle: 'agent', name: 'New teammate', program: '', format: 'text', stdin: true, modelFlag: '', args: [], resumeArgs: []},
    plan: 'its own login', login: 'sign in with that CLI'}
};
const CREDS = {
  claude: ['ANTHROPIC_API_KEY', 'ANTHROPIC_AUTH_TOKEN', 'ANTHROPIC_BASE_URL', 'CLAUDE_CODE_USE_VERTEX', 'CLAUDE_CODE_USE_BEDROCK', 'CLAUDE_CODE_USE_FOUNDRY', 'ANTHROPIC_VERTEX_BASE_URL', 'CLAUDE_CODE_SKIP_VERTEX_AUTH'],
  codex: ['CODEX_API_KEY', 'OPENAI_API_KEY', 'OPENAI_BASE_URL'],
  gemini: ['GEMINI_API_KEY', 'GOOGLE_API_KEY', 'GOOGLE_GENAI_USE_VERTEXAI', 'GOOGLE_GEMINI_BASE_URL'],
  muse: ['META_API_KEY'], custom: []
};
const KINDS = {
  default: {label: 'As configured', tag: 'your shell and each CLI\'s own config', short: 'CFG', color: '#6b7280', builtin: true,
    about: 'Leaves everything alone: each CLI uses whatever your shell and its own config already say.'},
  subscription: {label: 'Subscriptions', tag: 'the plans you signed in with', short: 'SUB', color: '#111214', builtin: true,
    about: 'Each CLI uses the plan you signed in with: Claude Pro or Max, a ChatGPT plan, your Google or Meta account. API keys in your shell are hidden from the run so they can\'t take over and bill per token.'},
  anthropic: {name: 'Anthropic API', label: 'Anthropic API key', short: 'ANT', color: '#c2410c', key: true, about: 'Claude Code bills per token to an Anthropic Console key.'},
  openai: {name: 'OpenAI API', label: 'OpenAI API key', short: 'OAI', color: '#0f766e', key: true, about: 'Codex bills per token to an OpenAI Platform key.'},
  vertex: {name: 'Vertex AI', label: 'Google Vertex AI / Model Garden', short: 'GCP', color: '#2563eb', key: false,
    about: 'Claude and Gemini models from your Google Cloud project, signed in with gcloud. Codex reaches OpenAI models on Vertex through the Responses API; for open models in Model Garden, put Codex behind LiteLLM.'},
  litellm: {name: 'LiteLLM', label: 'LiteLLM proxy', short: 'LLM', color: '#7c3aed', key: true,
    about: 'One LiteLLM proxy for everyone: Claude Code talks to its Anthropic endpoint, Codex to /v1/responses, Gemini CLI to its Gemini route. Model names are the model_name entries in your LiteLLM config.'},
  gateway: {name: 'Gateway', label: 'Other gateway', short: 'GW', color: '#be185d', key: true, about: 'Any gateway that speaks one of the APIs these CLIs use.'},
  env: {name: 'Custom env', label: 'Custom environment', short: 'ENV', color: '#4d7c0f', key: true,
    about: 'Your own environment variables for a run, one KEY=value per line. Write {key} where the key goes. Use it for anything not listed here: Bedrock, OpenRouter, a Gemini API key, Muse with META_API_KEY.'}
};
const ADDABLE = ['litellm', 'vertex', 'anthropic', 'openai', 'gateway', 'env'];
const BUILTIN = [{id: 'default', kind: 'default', name: 'As configured'}, {id: 'subscription', kind: 'subscription', name: 'Subscriptions'}];
const SUGGEST = {
  vertex: ['claude-opus-4-8', 'claude-sonnet-5', 'claude-haiku-4-5@20251001', 'gemini-2.5-pro', 'gemini-2.5-flash', 'gpt-6-luna'],
  anthropic: ['claude-opus-4-8', 'claude-sonnet-5'], openai: ['gpt-6-luna']
};

const DEFAULT_TEAM = () => ({
  version: 2, humanName: '', maxHops: 6, maxRuns: 6, reviewByLead: true, notify: true,
  rooms: [{id: 'general', name: 'general', cwd: '~'}],
  providers: [],
  agents: [
    {...CLIS.claude.preset, kind: 'claude', role: 'lead', mode: 'spawn', enabled: true, provider: 'subscription', model: '', cwd: '', color: '#c2410c'},
    {...CLIS.codex.preset, kind: 'codex', role: 'worker', mode: 'spawn', enabled: true, provider: 'subscription', model: '', cwd: '', color: '#16181f'},
    {...CLIS.muse.preset, kind: 'muse', role: 'worker', mode: 'spawn', enabled: true, provider: 'subscription', model: '', cwd: '', color: '#0e8c7e'}
  ]
});

const S = {mode: 'boot', D: null, platform: '', home: '', base: '', shell: '/bin/zsh', env: null, team: DEFAULT_TEAM(),
  rooms: new Map(), room: 'general', routed: new Set(), sessions: {}, lastSeen: {}, runs: new Map(), queues: new Map(),
  avail: {}, paused: false, drawer: null, logRun: null, toggles: new Set(), teamMtime: 0, humanName: 'You', trayOff: false, newRoom: false,
  secrets: {}, keyCache: {}, draft: null, draftSecrets: {}, tab: 'teammates', ptest: {}, sheetOpen: false,
  view: 'home', expanded: new Set(), closedSecs: new Set(), shownChains: new Set(), paneW: 480, pane: undefined, lastPane: 'office', officeFull: false, q: '', detail: null, keepScroll: false};

const agents = () => S.team.agents;
const agentBy = h => agents().find(a => a.handle === String(h || '').toLowerCase());
const lead = () => agents().find(a => a.role === 'lead' && a.enabled);
const providersOf = t => BUILTIN.concat(t.providers || []);
const providerBy = (id, t = S.team) => providersOf(t).find(p => p.id === id) || BUILTIN[0];
const cur = () => S.rooms.get(S.room) || [...S.rooms.values()][0];
const expand = p => { p = String(p || '~').trim() || '~'; if (!S.home) return p; return p === '~' ? S.home : p.startsWith('~/') ? S.home + p.slice(1) : p; };
const tilde = p => S.home && String(p).startsWith(S.home) ? '~' + String(p).slice(S.home.length) : String(p);
const roomPath = id => `${S.base}/rooms/${id}.jsonl`;
const initials = n => { const w = String(n).trim().split(/\s+/); return (w.length > 1 ? w[0][0] + w[1][0] : String(n).slice(0, 2)).toUpperCase(); };
const slug = (s, n = 32) => String(s).toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, n);
const rootUrl = u => String(u || '').trim().replace(/\/+$/, '').replace(/\/v1$/, '');

function normalizeTeam(t) {
  const d = DEFAULT_TEAM();
  t = (t && typeof t === 'object') ? t : d;
  t.version = 2;
  t.maxHops = Math.min(50, Math.max(1, parseInt(t.maxHops, 10) || 6));
  t.maxRuns = Math.min(16, Math.max(1, parseInt(t.maxRuns, 10) || 6));
  t.reviewByLead = t.reviewByLead !== false; t.notify = t.notify !== false;
  t.humanName = typeof t.humanName === 'string' ? t.humanName.slice(0, 40) : '';
  const pids = new Set(['default', 'subscription']);
  t.providers = (Array.isArray(t.providers) ? t.providers : []).filter(p => p && ADDABLE.includes(p.kind) && /^[a-z0-9][a-z0-9_-]{0,31}$/.test(p.id || '') && !pids.has(p.id) && pids.add(p.id)).map(p => ({
    id: p.id, kind: p.kind, name: String(p.name || KINDS[p.kind].name).slice(0, 60),
    baseUrl: String(p.baseUrl || (p.kind === 'litellm' ? 'http://localhost:4000' : '')).trim(),
    project: String(p.project || '').trim(), region: String(p.region || 'global').trim(), credentials: String(p.credentials || '').trim(),
    protocol: ['anthropic', 'openai', 'gemini'].includes(p.protocol) ? p.protocol : 'anthropic', authHeader: p.authHeader === 'x-api-key' ? 'x-api-key' : 'bearer',
    keySource: ['none', 'env', 'command', 'saved'].includes(p.keySource) ? p.keySource : (KINDS[p.kind].key ? 'env' : 'none'),
    keyEnv: String(p.keyEnv || '').trim(), keyCmd: String(p.keyCmd || '').trim(), envText: String(p.envText || ''),
    models: Array.isArray(p.models) ? p.models.map(String).slice(0, 300) : []}));
  const seen = new Set();
  t.agents = (Array.isArray(t.agents) ? t.agents : d.agents).filter(a => a && /^[a-z0-9][a-z0-9_-]{0,23}$/.test(String(a.handle || '').toLowerCase())).map((a, i) => {
    const h = String(a.handle).toLowerCase();
    if (seen.has(h)) return null; seen.add(h);
    const kind = CLIS[a.kind] ? a.kind : a.format === 'claude' ? 'claude' : a.format === 'codex' ? 'codex' : a.format === 'gemini' ? 'gemini' : /(^|\/)muse$/.test(a.program || '') ? 'muse' : 'custom';
    return {handle: h, name: String(a.name || h).slice(0, 40), kind, role: a.role === 'lead' ? 'lead' : 'worker',
      mode: a.mode === 'external' ? 'external' : 'spawn', enabled: a.enabled !== false,
      program: String(a.program ?? CLIS[kind].preset.program), args: Array.isArray(a.args) ? a.args.map(String) : [],
      resumeArgs: Array.isArray(a.resumeArgs) ? a.resumeArgs.map(String) : [], stdin: a.stdin !== false,
      format: ['claude', 'codex', 'gemini', 'text'].includes(a.format) ? a.format : 'text', cwd: String(a.cwd || ''),
      provider: pids.has(a.provider) ? a.provider : (a.provider ? 'default' : 'subscription'), model: String(a.model || '').trim(),
      modelFlag: typeof a.modelFlag === 'string' ? a.modelFlag.trim() : CLIS[kind].preset.modelFlag,

async function saveSettings() {
  const t = S.draft, err = m => { $('#serr').textContent = m; };
  if (S.mode !== 'live') return;
  for (const [i, a] of t.agents.entries()) {
    a.handle = String(a.handle || '').trim().toLowerCase().replace(/^@/, '');
    if (!/^[a-z0-9][a-z0-9_-]{0,23}$/.test(a.handle)) { S.tab = 'teammates'; S.detail = {k: 'agent', i}; renderSheet(); return err(`${a.name || 'Teammate ' + (i + 1)} needs a handle: letters, digits, - or _.`); }
    if (a.mode === 'spawn' && !a.program) { S.tab = 'teammates'; S.detail = {k: 'agent', i}; renderSheet(); return err(`${a.name} needs a command.`); }
  }
  if (new Set(t.agents.map(a => a.handle)).size !== t.agents.length) return err('Two teammates share a handle.');
  if (t.agents.filter(a => a.role === 'lead').length > 1) return err('Only one lead, please.');
  for (const r of t.rooms) if (!(await S.D.fs.exists(expand(r.cwd)).catch(() => false))) { S.tab = 'rooms'; S.detail = null; renderSheet(); return err(`${r.cwd} doesn't exist.`); }

  for (const id of Object.keys(secrets)) if (!ids.has(id)) delete secrets[id];
  try {
    if (JSON.stringify(secrets) !== JSON.stringify(S.secrets)) await saveSecrets(secrets);
    S.team = normalizeTeam(clone(t)); await saveTeam();
  } catch (x) { return err(x.message); }
  S.humanName = S.team.humanName || S.osName || S.humanName;
  for (const p of S.team.providers) delete S.keyCache[p.id];

  for (const r of S.rooms.values()) if (r.size < 0) await readRoom(r, true);

async function curlJSON(url, headers) {

  const r = await S.D.childProcess.exec(`curl -sS -m 12 -w "\\n%{http_code}" -K -`, {timeout: 20000, input: cfg, env: S.env || undefined});

  return {status, json, body};
}
async function testProvider(id) {
  const t = S.draft || S.team, p = providerBy(id, t), done = (ok, msg) => { S.ptest[id] = {ok, msg}; if (S.sheetOpen) renderSheet(); };
  S.ptest[id] = {ok: true, msg: 'Testing…'}; if (S.sheetOpen) renderSheet();
  try {
    const cp = S.D.childProcess;
    if (p.kind === 'subscription') {
      const lines = [];
      for (const a of t.agents.filter(x => x.provider === 'subscription' && x.enabled && x.mode === 'spawn')) {
        if (a.kind === 'codex') { const r = await cp.exec(`${shq(a.program)} login status`, {timeout: 15000, env: S.env || undefined}).catch(e => ({code: 1, stderr: e.message})); lines.push(`@${a.handle}: ${first((r.stdout || r.stderr || '').trim() || 'no answer', 90)}`); }
        else lines.push(`@${a.handle}: ${CLIS[a.kind].login} if it asks`);
      }
      return done(true, lines.join('. ') || 'No teammates use subscriptions.');
    }
    if (p.kind === 'vertex') {
      if (!p.project) return done(false, 'Set a project ID first.');
      const env = {...(S.env || {})}; if (p.credentials) env.GOOGLE_APPLICATION_CREDENTIALS = expand(p.credentials);
      const r = await cp.exec('gcloud auth application-default print-access-token', {timeout: 20000, env});
      if (r.code !== 0 || !r.stdout.trim()) return done(false, first(r.stderr || 'gcloud could not get a token. Run gcloud auth application-default login.', 200));
      return done(true, `gcloud credentials work. Requests go to ${p.project} in ${p.region || 'global'}; model access is checked on the first run.`);
    }
    if (p.kind === 'env') return done(true, 'Nothing to test here. Run a teammate and read its log.');
    const key = await resolveKey(p, S.draftSecrets[p.id]);
    let url, headers = [];
    if (p.kind === 'anthropic') { url = 'https://api.anthropic.com/v1/models?limit=100'; headers = ['x-api-key: ' + key, 'anthropic-version: 2023-06-01']; }
    else if (p.kind === 'openai') { url = 'https://api.openai.com/v1/models'; headers = ['Authorization: Bearer ' + key]; }
    else if (p.kind === 'litellm') { url = rootUrl(p.baseUrl) + '/v1/models'; if (key) headers = ['Authorization: Bearer ' + key]; }
    else if (p.protocol === 'anthropic') { url = p.baseUrl.replace(/\/+$/, '') + '/v1/models'; if (key) headers = [p.authHeader === 'x-api-key' ? 'x-api-key: ' + key : 'Authorization: Bearer ' + key, 'anthropic-version: 2023-06-01']; }
    else if (p.protocol === 'openai') { url = p.baseUrl.replace(/\/+$/, '') + '/models'; if (key) headers = ['Authorization: Bearer ' + key]; }
    else return done(true, 'No test for Gemini-format gateways yet. Run a teammate and read its log.');
    const r = await curlJSON(url, headers);
    if (r.status === 401 || r.status === 403) return done(false, `The key was rejected (${r.status}).`);
    if (r.status !== 200) return done(false, `HTTP ${r.status || '?'} from ${url}: ${first(r.json?.error?.message || r.body, 140)}`);
    const models = (r.json?.data || []).map(m => m.id).filter(Boolean);
    const live = (S.draft || S.team).providers.find(x => x.id === id); if (live) live.models = models.slice(0, 300);
    const real = S.team.providers.find(x => x.id === id); if (real && S.draft) { real.models = models.slice(0, 300); saveTeam().catch(() => {}); }
    return done(true, `Connected. ${models.length} model${models.length === 1 ? '' : 's'} available.`);
  } catch (e) { done(false, e.message); }
}

}

$('#form').addEventListener('submit', e => { e.preventDefault(); send(); });
$('#ta').addEventListener('input', () => { grow(); openPop(); });
$('#ta').addEventListener('keydown', e => {
  if ($('#pop').classList.contains('open') && popItems.length) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); popSel = (popSel + (e.key === 'ArrowDown' ? 1 : -1) + popItems.length) % popItems.length; openPop(); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickAt(popItems[popSel].handle); return; }
    if (e.key === 'Escape') { closePop(); return; }
  }
  if ((e.metaKey || e.ctrlKey) && /^[bi]$/i.test(e.key)) { e.preventDefault(); fmt(e.key.toLowerCase()); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
let qTimer = 0;
$('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = $('#q').value; if (S.q.trim().length >= 2) { S.pane = 'search'; S.officeFull = false; } else if (S.pane === 'search') S.pane = S.lastPane || null; renderPane(); renderHeader(); }, 160); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { $('#q').value = ''; S.q = ''; if (S.pane === 'search') S.pane = S.lastPane || null; renderPane(); $('#q').blur(); } });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); openSettings(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'Escape' && S.sheetOpen) { if (S.detail) { S.detail = null; S.keepScroll = false; renderSheet(); } else closeSettings(); }
  else if (e.key === 'Escape' && OFF.openId) officeClose();
});
$('#sheet').addEventListener('input', onSheetInput);
$('#sheet').addEventListener('change', onSheetInput);
$('#sheet').addEventListener('mousedown', e => { if (e.target.id === 'sheet') closeSettings(); });
$('#divider').addEventListener('pointerdown', e => {
  e.preventDefault(); const pane = $('#pane'); $('#divider').setPointerCapture(e.pointerId);
  const move = ev => { S.paneW = Math.round(Math.max(340, Math.min(innerWidth - 700, innerWidth - ev.clientX))); pane.style.width = S.paneW + 'px'; };
  const up = () => { $('#divider').removeEventListener('pointermove', move); $('#divider').removeEventListener('pointerup', up); try { localStorage.setItem('at.paneW', S.paneW); } catch {} };
  $('#divider').addEventListener('pointermove', move); $('#divider').addEventListener('pointerup', up);
});
document.addEventListener('click', async e => {
  const bub = e.target.closest('[data-clamp]'); if (bub && !e.target.closest('a,button')) { bub.classList.toggle('full'); bub.querySelector('.clamp').style.webkitLineClamp = bub.classList.contains('full') ? 'unset' : ''; return; }
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.room) { S.view = 'home'; switchRoom(d.room); }
  else if (d.dm) openDM(d.dm);
  else if (d.jump) { S.view = 'home'; switchRoom(d.jump); if (d.msg) requestAnimationFrame(() => document.querySelector(`[data-id="${CSS.escape(d.msg)}"]`)?.scrollIntoView({block: 'center'})); }
  else if (d.view) { if (d.view === 'office') setPane('office'); else { S.view = d.view; renderSidebar(); } }
  else if (d.sec) { S.closedSecs.has(d.sec) ? S.closedSecs.delete(d.sec) : S.closedSecs.add(d.sec); renderSidebar(); }
  else if (d.to) { S.toggles.has(d.to) ? S.toggles.delete(d.to) : S.toggles.add(d.to); renderTo(); $('#ta').focus(); }
  else if (d.pickAt) pickAt(d.pickAt);
  else if (d.fmt) fmt(d.fmt);
  else if (d.fold) { S.expanded.has(d.fold) ? S.expanded.delete(d.fold) : S.expanded.add(d.fold); renderFeed(); }
  else if (d.reply) { const ta = $('#ta'); ta.value = `@${d.reply} ` + ta.value.replace(/^@\S+\s/, ''); ta.focus(); grow(); }
  else if (d.copymsg) { const m = cur()?.messages.find(x => x.id === d.copymsg); if (m) navigator.clipboard?.writeText(m.text).catch(() => {}); }
  else if (d.log) { await loadRun(d.log); S.logRun = d.log; S.pane = 'runs'; S.officeFull = false; renderPane(); renderHeader(); }
  else if (d.pick) { S.logRun = d.pick; renderLog(); }
  else if (d.pane) { S.pane = d.pane; if (d.pane !== 'search') S.lastPane = d.pane; if (d.pane !== 'office') S.officeFull = false; renderPane(); renderHeader(); renderSidebar(); try { localStorage.setItem('at.pane', S.pane); } catch {} }
  else if (d.stop) stopRun(d.stop);
  else if (d.continue) { const room = cur(), m = room.messages.find(x => x.id === d.continue); if (m) { route(m, room, true); t.disabled = true; t.textContent = 'Continued'; } }
  else if (d.reveal) S.D.shell.showItemInFolder(`${S.base}/runs/${d.reveal}/prompt.md`).catch(() => {});
  else if (d.open) openSettings(d.open);
  else if (d.tab) { S.tab = d.tab; S.detail = null; S.keepScroll = false; renderSheet(); }
  else if (d.back != null) { S.detail = null; S.keepScroll = false; renderSheet(); }
  else if (d.openAgent != null) { S.detail = {k: 'agent', i: +d.openAgent}; S.keepScroll = false; renderSheet(); }
  else if (d.openAgentH) { const i = S.team.agents.findIndex(a => a.handle === d.openAgentH); openSettings('teammates', i >= 0 ? {k: 'agent', i} : null); }
  else if (d.openProv) { S.detail = {k: 'prov', id: d.openProv}; S.keepScroll = false; renderSheet(); }
  else if (d.segp) { setPath(S.draft, d.segp, d.segv); renderSheet(); }
  else if (d.rmAgent != null) { S.draft.agents.splice(+d.rmAgent, 1); S.detail = null; renderSheet(); }
  else if (d.rmProv != null) { const p = S.draft.providers.splice(+d.rmProv, 1)[0]; for (const a of S.draft.agents) if (a.provider === p.id) a.provider = 'subscription'; S.draftSecrets[p.id] = null; S.detail = null; renderSheet(); }
  else if (d.rmRoom != null) { S.draft.rooms.splice(+d.rmRoom, 1); renderSheet(); }
  else if (d.ptest) testProvider(d.ptest);
  else if (d.forget) { S.draftSecrets[d.forget] = null; renderSheet(); }
  else if (d.copy) { navigator.clipboard?.writeText(d.copy).catch(() => {}); t.textContent = 'copied'; setTimeout(() => { t.textContent = d.copy; }, 900); }
  else if (d.oagent || d.oview) officeOpen(d.oagent || d.oview);
  else if (d.oclose != null) officeClose();
  else if (d.od) { const el = document.getElementById(d.od), was = el.classList.contains('open-d'); document.querySelectorAll('.open-d').forEach(x => x.classList.remove('open-d')); if (!was) el.classList.add('open-d'); }
  else if (t.classList.contains('o-chead')) t.parentElement.classList.toggle('open');
  else if (t.id === 'o-tour') { OFF.touring = !OFF.touring; t.classList.toggle('on', OFF.touring); t.setAttribute('aria-pressed', OFF.touring); $('#o-tourIcon').textContent = OFF.touring ? '■' : '▶'; OFF.scene?.setTour(OFF.touring); }
  else if (t.id === 'o-zin') OFF.scene?.zoomBy(1.2);
  else if (t.id === 'o-zout') OFF.scene?.zoomBy(1 / 1.2);
  else if (t.id === 'addmate') {
    const k = $('#addcli').value, pr = CLIS[k].preset, hs = new Set(S.draft.agents.map(a => a.handle));
    let h = pr.handle, n = 2; while (hs.has(h)) h = pr.handle + n++;
    S.draft.agents.push({...clone(pr), handle: h, name: hs.has(pr.handle) ? `${pr.name} ${n - 1}` : pr.name, kind: k, role: 'worker', mode: 'spawn', enabled: true, provider: 'subscription', model: '', cwd: '', color: PALETTE[S.draft.agents.length % PALETTE.length]});
    S.detail = {k: 'agent', i: S.draft.agents.length - 1}; S.keepScroll = false; renderSheet();
  }
  else if (t.id === 'addprovbtn') {
    const k = $('#addprov').value, ids = new Set(providersOf(S.draft).map(p => p.id));
    let id = slug(k), n = 2; while (ids.has(id)) id = slug(k) + '-' + n++;
    S.draft.providers.push({id, kind: k, name: KINDS[k].name + (n > 2 ? ' ' + (n - 1) : ''), baseUrl: k === 'litellm' ? 'http://localhost:4000' : '', project: '', region: 'global', credentials: '', protocol: 'anthropic', authHeader: 'bearer',
      keySource: KINDS[k].key ? 'env' : 'none', keyEnv: {litellm: 'LITELLM_API_KEY', anthropic: 'ANTHROPIC_API_KEY', openai: 'OPENAI_API_KEY'}[k] || '', keyCmd: '', envText: '', models: []});
    S.detail = {k: 'prov', id}; S.keepScroll = false; renderSheet();
  }
  else if (t.id === 'addroombtn') {
    const name = $('#addroomname').value.trim(), id = slug(name, 40);
    if (!id || S.draft.rooms.some(r => r.id === id)) { $('#serr').textContent = id ? 'That channel exists.' : 'Give the channel a name.'; return; }
    S.draft.rooms.push({id, name: id, cwd: $('#addroomcwd').value.trim() || '~'}); renderSheet();
  }
  else if (t.id === 'ssave') saveSettings();
  else if (t.id === 'scancel') closeSettings();
  else if (t.id === 'setbtn' || t.id === 'wsname') openSettings(t.id === 'wsname' ? 'general' : undefined);
  else if (t.id === 'members') openSettings('teammates');
  else if (t.id === 'opendata') S.D.shell.openPath(S.base).catch(() => {});
  else if (t.id === 'recheck') { S.env = await captureEnv(); checkAvail(); }
  else if (t.id === 'pause') togglePause();
  else if (t.id === 'runsbtn') setPane('runs');
  else if (t.id === 'officebtn') setPane('office');
  else if (t.id === 'paneclose') { S.pane = null; S.officeFull = false; renderPane(); renderHeader(); renderSidebar(); try { localStorage.setItem('at.pane', ''); } catch {} }
  else if (t.id === 'paneexpand') { S.officeFull = !S.officeFull; renderPane(); setTimeout(() => OFF.scene?.resize?.(), 30); }
  else if (t.id === 'folder' && S.mode === 'live') S.D.shell.openPath(expand(cur().cwd)).catch(err => banner(`Can't open ${cur().cwd}: ${err.message}`));
  else if (t.id === 'newroom' || t.id === 'newroom2') { S.view = 'home'; renderSidebar(); showNewRoom(); }
});
document.addEventListener('click', e => { if (e.target.id === 'o-detback') officeClose(); });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'nrform') return;
  e.preventDefault(); if (S.mode !== 'live') return;
  const f = e.target, name = f.name.value.trim(), cwd = f.cwd.value.trim() || '~', id = slug(name, 40);
  if (!id) { $('#nrerr').textContent = 'Give it a name.'; return; }
  if (S.rooms.has(id)) { $('#nrerr').textContent = 'That channel exists.'; return; }
  if (!(await S.D.fs.exists(expand(cwd)).catch(() => false))) { $('#nrerr').textContent = `${cwd} doesn't exist.`; return; }
  S.team.rooms.push({id, name: id, cwd}); await saveTeam(); ensureRooms();
  await readRoom(S.rooms.get(id), true); S.room = id; S.newRoom = false; renderAll();
});
window.addEventListener('focus', () => { const r = cur(); if (r?.unread) { r.unread = 0; renderSidebar(); } badge(); });
setInterval(() => { for (const n of document.querySelectorAll('[data-start]')) n.textContent = el(Date.now() - +n.dataset.start); }, 1000);

boot();
}
</script>
