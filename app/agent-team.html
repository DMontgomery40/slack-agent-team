<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Team</title>
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["full-access", "notifications", "menu-bar"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a dispatcher's desk. Calm, exact, a little physical. Live work is the only thing that lights up.
   IDEA: an air-traffic strip board. Teammates are paper strips racked on a cobalt board; a working one slides out with a yellow holder.
   PICTURE: the strip bay in the rail, and the live strip in the transcript, with its sweeping yellow tick.
   COLOUR and TYPE: white paper, ink, cobalt board, signal yellow; Archivo (condensed for callsigns and titles) + JetBrains Mono for things you'd type.
   LAYOUT: cobalt rail full height at left, paper transcript in the middle, runs drawer at right, settings as a sheet on the same board. */
:root{color-scheme:light dark;
--paper:light-dark(#ffffff,#14151c);--pane:light-dark(#f4f5f8,#1b1d27);--well:light-dark(#eceef3,#232634);
--ink:light-dark(#121420,#eceef5);--ink2:light-dark(#3a3e4f,#c3c6d6);--mute:light-dark(#646a7d,#9095ab);--line:light-dark(#e3e5ec,#2a2d3b);--line2:light-dark(#cfd3de,#3a3e50);
--board:light-dark(#2238b8,#18278a);--board2:light-dark(#1b2ea0,#121e70);--bink:#ffffff;--bmute:light-dark(#c3cbff,#a5afec);--bline:light-dark(#3a50c9,#25359e);
--strip:#ffffff;--sink:#121420;--smute:#5f6578;
--sig:#ffd60a;--bad:light-dark(#c8261e,#ff7b70);--ok:light-dark(#127a4a,#58c98f);--focus:#2238b8;
--cond:72%;--r:10px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark;--focus:#8fa2ff}
*{box-sizing:border-box;min-width:0}
[style*="--c:"]{--cc:light-dark(var(--c),color-mix(in oklab,var(--c),white 42%))}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Archivo,ui-sans-serif,system-ui,sans-serif;overflow:hidden;font-feature-settings:"tnum" 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
code,pre,.mono,.act,kbd{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cond{font-stretch:var(--cond)}

#app{display:grid;grid-template-columns:292px minmax(0,1fr) auto;height:100vh}

/* rail: the strip board */
.rail{background:var(--board);color:var(--bink);display:flex;flex-direction:column;min-height:0;position:relative}
.rail::after{content:"";position:absolute;inset:0 0 0 auto;width:1px;background:var(--board2)}
.rail-top{height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;-webkit-app-region:drag;app-region:drag;user-select:none}
.desk.os-darwin .rail-top{padding-left:86px}
.mark{width:22px;height:16px;display:grid;gap:3px;flex:none}
.mark i{display:block;height:3.5px;border-radius:2px;background:#fff}.mark i:nth-child(2){background:var(--sig);width:100%}.mark i:nth-child(1){width:70%}.mark i:nth-child(3){width:50%}
.brand{font-weight:700;font-stretch:var(--cond);font-size:19px;letter-spacing:.005em;white-space:nowrap}
.rail-scroll{flex:1;overflow:auto;padding:4px 14px 18px;scrollbar-width:thin;scrollbar-color:var(--bline) transparent}
.rail h2{font-size:12.5px;font-weight:500;color:var(--bmute);margin:16px 6px 7px}
.rooms{display:grid;gap:2px}
.rooms button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--bink);text-align:left;padding:7px 10px;border-radius:7px;min-height:36px;font-size:15px}
.rooms button .hash{opacity:.55;font-weight:500}
.rooms button:hover{background:var(--bline)}
.rooms button[aria-current=true]{background:var(--strip);color:var(--sink);font-weight:600;box-shadow:0 1px 0 rgb(0 0 0/.18)}
.rooms button[aria-current=true] .hash{opacity:.4}
.rooms .n{margin-left:auto;background:var(--sig);color:var(--sink);border-radius:9px;font-size:11.5px;font-weight:700;padding:0 7px;line-height:18px}
.newroom{border:0;background:none;color:var(--bmute);padding:6px 10px;font-size:13.5px;border-radius:7px;display:flex;align-items:center;gap:6px}
.newroom:hover{color:var(--bink);background:var(--bline)}
form.nr{display:grid;gap:8px;padding:12px;background:var(--strip);color:var(--sink);border-radius:9px;margin:6px 0}
form.nr label{color:var(--smute)}
form.nr input{background:#fff;color:var(--sink);border-color:#d5d9e3}
.bay{display:grid;gap:7px}
.strip{position:relative;display:grid;grid-template-columns:9px minmax(0,1fr);background:var(--strip);color:var(--sink);border-radius:5px;box-shadow:0 1px 0 rgb(0 0 0/.22),0 0 0 1px rgb(0 0 0/.04);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.strip .holder{background:var(--c)}
.strip .sb{padding:8px 10px 9px 11px;display:grid;gap:1px}
.strip .l1{display:flex;align-items:baseline;gap:7px}
.strip .call{font-weight:700;font-stretch:var(--cond);font-size:17px;line-height:1.15;letter-spacing:.01em}
.strip .role{font-size:11px;font-weight:600;color:var(--smute);border:1px solid #d5d9e3;border-radius:4px;padding:0 4px;line-height:15px}
.strip .stat{margin-left:auto;font-size:12px;color:var(--smute);white-space:nowrap}
.strip .route{font-size:12px;color:var(--smute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .route b{font-weight:500;color:#3a3e4f}
.strip .act{font-size:11px;color:#3a3e4f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.strip.working{transform:translateX(8px)}
.strip.working .holder{background:linear-gradient(var(--c) 0 50%,var(--sig) 50%)}
.strip.working .stat{color:var(--sink);background:var(--sig);border-radius:4px;padding:0 6px;font-weight:600}
.strip.off{opacity:.5}
.strip.bad .stat{color:var(--bad)}
.tick{position:absolute;left:9px;right:0;bottom:0;height:3px;overflow:hidden}
.tick::after{content:"";position:absolute;top:0;bottom:0;width:34%;background:var(--sig);animation:sweep 1.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sweep{from{left:-34%}to{left:100%}}
.rail-foot{padding:10px 14px 14px;border-top:1px solid var(--bline);display:flex;gap:6px}
.rail-foot button{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--bink);font-size:14px;padding:8px 10px;border-radius:7px;min-height:38px}
.rail-foot button:hover{background:var(--bline)}
.rail-foot kbd{margin-left:auto;font-size:11px;color:var(--bmute);display:none}.os-darwin .rail-foot kbd{display:inline}

/* main */
.room{display:flex;flex-direction:column;min-height:0;background:var(--paper)}
header{height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px 0 32px;border-bottom:1px solid var(--line);-webkit-app-region:drag;app-region:drag;user-select:none}
header button{-webkit-app-region:no-drag;app-region:no-drag}
.title{display:flex;align-items:baseline;gap:12px;min-width:0}
.title h1{margin:0;font-size:27px;line-height:1;font-weight:700;font-stretch:var(--cond);letter-spacing:-.005em;white-space:nowrap}
.title h1 span{color:var(--mute);font-weight:500;margin-right:2px}
.folder{border:0;background:none;padding:2px 4px;border-radius:5px;font:12.5px "JetBrains Mono",monospace;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw;display:flex;align-items:center;gap:5px}
.folder:hover{color:var(--ink);background:var(--pane)}
.folder .ic{width:14px;height:14px}
.grow{flex:1}
.readout{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute);white-space:nowrap}
.readout i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.readout.on{color:var(--ink);font-weight:600}.readout.on i{background:var(--sig);box-shadow:0 0 0 3px color-mix(in srgb,var(--sig) 35%,transparent)}
.readout.paused i{background:var(--mute)}
.hb{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--paper);border-radius:8px;height:34px;padding:0 12px;font-size:13.5px;font-weight:500;white-space:nowrap}
.hb:hover{background:var(--pane)}
.hb[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hb:disabled{opacity:.45;cursor:default}

.banner{display:none;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 32px;background:var(--sig);color:var(--sink);font-size:14px;font-weight:500}
.banner.show{display:flex}
.banner .hb{background:var(--sink);color:#fff;border-color:var(--sink)}
#scroll{flex:1;min-height:0;overflow:auto;padding:22px 0 10px;overscroll-behavior:contain}
.feed,.lives{max-width:820px;padding:0 32px 0 40px}
.msg{display:grid;grid-template-columns:4px minmax(0,1fr);gap:16px;padding:9px 0}
.msg.cont{padding-top:0}
.msg .rule{background:var(--cc);border-radius:2px}
.msg.me .rule{background:transparent}
.meta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);line-height:1.3;margin-bottom:3px}
.who{font-size:15px;font-weight:700;font-stretch:85%;color:var(--cc)}
.me .who{color:var(--ink)}
.tag{font-size:11px;font-weight:600;color:var(--mute);border:1px solid var(--line2);border-radius:4px;padding:0 4px;line-height:15px}
.lnk{border:0;background:none;padding:0;font-size:12.5px;color:var(--mute);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.lnk:hover{color:var(--ink);text-decoration-color:currentColor}.lnk.stop:hover{color:var(--bad)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.6;color:var(--ink)}
.me .txt{background:var(--pane);border-radius:4px 14px 14px 14px;padding:9px 14px;display:inline-block;max-width:100%}
.txt code,.note code,.empty code{font-size:.86em;background:var(--well);padding:1px 5px;border-radius:4px}
.txt pre{white-space:pre;overflow:auto;background:var(--well);padding:12px 14px;border-radius:8px;font-size:12.5px;line-height:1.55;margin:8px 0}
.txt pre code{background:none;padding:0}
.txt a{color:var(--focus);text-underline-offset:2px}
.at{font-weight:600;color:var(--cc)}
.sys{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--mute);font-size:13px;padding:10px 0 10px 20px;text-align:center}
.sys .hb{height:28px;font-size:12.5px}
.day{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:12.5px;font-weight:500;margin:14px 0 8px 20px}
.day::before,.day::after{content:"";flex:1;border-top:1px solid var(--line)}
.sample{font-size:12.5px;color:var(--mute);margin:0 0 6px 20px}
.lives{padding-top:2px}
.live{position:relative;display:grid;grid-template-columns:9px minmax(0,1fr);background:var(--strip);color:var(--sink);border-radius:6px;margin:10px 0 10px 20px;box-shadow:0 0 0 1px var(--line2),0 6px 18px -10px rgb(18 20 32/.35);overflow:hidden}
.live .holder{background:linear-gradient(var(--c) 0 50%,var(--sig) 50%)}
.live .sb{padding:10px 14px 12px}
.live .l1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.live .call{font-weight:700;font-stretch:var(--cond);font-size:18px}
.live .state{font-size:12px;font-weight:700;background:var(--sig);border-radius:4px;padding:0 6px;line-height:18px}
.live .el{font-size:13px;color:var(--smute)}
.live .route{font-size:12.5px;color:var(--smute)}
.live .lnk{color:var(--smute)}.live .lnk:hover{color:var(--sink)}
.live .act{font-size:12px;color:#3a3e4f;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live.q .holder{background:var(--c);opacity:.35}.live.q .state{background:#eceef3;color:var(--smute)}
.empty{max-width:560px;margin:10vh 0 0 60px;color:var(--ink2)}
.empty h3{color:var(--ink);font-size:36px;line-height:1.05;margin:0 0 14px;font-weight:700;font-stretch:var(--cond);letter-spacing:-.01em}
.empty p{margin:0 0 10px;font-size:15.5px}

.composer{padding:8px 32px 20px 60px;max-width:860px;position:relative}
.box{background:var(--paper);border:1.5px solid var(--line2);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 8px 24px -16px rgb(18 20 32/.25)}
.box:focus-within{border-color:color-mix(in oklab,var(--ink) 40%,var(--line2))}
.to{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px;font-size:12.5px;color:var(--mute)}
.to button{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--paper);border-radius:14px;padding:0 10px;font-size:13px;min-height:28px;color:var(--ink2)}
.to button i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.to button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}.to button[aria-pressed=true] i{background:#fff}
.row2{display:flex;gap:10px;align-items:flex-end}
#ta{flex:1;border:0;background:none;resize:none;outline:none;font-size:16px;line-height:1.5;max-height:240px;padding:6px 0}
#ta::placeholder{color:var(--mute)}
.send{background:var(--ink);color:var(--paper);border:0;border-radius:10px;height:38px;padding:0 18px;font-weight:600;display:flex;align-items:center;gap:6px}
.send:disabled{opacity:.35;cursor:default}
.hint{font-size:12.5px;color:var(--mute);margin:7px 2px 0}
.pop{position:absolute;bottom:calc(100% - 4px);left:60px;background:var(--paper);border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 30px -12px rgb(0 0 0/.3);padding:5px;min-width:260px;display:none;z-index:3}
.pop.open{display:block}
.pop button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 9px;border-radius:8px;text-align:left}
.pop button i{width:9px;height:24px;border-radius:2px;background:var(--c)}
.pop button[aria-selected=true]{background:var(--pane)}
.pop small{color:var(--mute)}

/* runs drawer */
.drawer{width:420px;border-left:1px solid var(--line);background:var(--pane);display:none;grid-template-rows:64px minmax(0,1fr);min-height:0}
.drawer.open{display:grid}
.dh{display:flex;align-items:center;gap:8px;padding:0 16px 0 22px;border-bottom:1px solid var(--line);-webkit-app-region:drag;app-region:drag}
.dh button{-webkit-app-region:no-drag;app-region:no-drag}
.dh h2{font-size:20px;margin:0;font-weight:700;font-stretch:var(--cond)}
.db{overflow:auto;padding:16px 18px 28px}
.runs{display:grid;gap:5px;margin-bottom:14px}
.runs button{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:var(--paper);border-radius:6px;padding:0 10px 0 0;text-align:left;font-size:13.5px;min-height:44px;box-shadow:0 0 0 1px var(--line)}
.runs button .holder{align-self:stretch;background:var(--cc);border-radius:6px 0 0 6px}
.runs button[aria-current=true]{box-shadow:0 0 0 2px var(--ink)}
.runs small{color:var(--mute)}
.pill{font-size:11.5px;font-weight:600;padding:0 7px;border-radius:4px;line-height:19px;white-space:nowrap;background:var(--well);color:var(--ink2)}
.pill.running{background:var(--sig);color:var(--sink)}.pill.done,.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.failed,.pill.stopped,.pill.no{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.runhead{background:var(--paper);border-radius:8px;padding:12px 14px;box-shadow:0 0 0 1px var(--line);margin-bottom:12px}
.runhead .call{font-weight:700;font-stretch:var(--cond);font-size:20px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;font-size:12.5px;margin-top:6px}
.facts dt{color:var(--mute)}.facts dd{margin:0;overflow-wrap:anywhere}
.ev{display:grid;grid-template-columns:58px 54px minmax(0,1fr);gap:8px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.ev time{color:var(--mute)}.ev .k{color:var(--mute);font-weight:500}
.ev .x{white-space:pre-wrap;overflow-wrap:anywhere;font-family:"JetBrains Mono",monospace;font-size:11.5px}
.ev.k-text .x{font-family:Archivo,sans-serif;font-size:13.5px}
.ev.k-error .k,.ev.k-stderr .k{color:var(--bad)}
details{margin:8px 0}summary{cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500}
details pre{white-space:pre-wrap;font-size:11.5px;background:var(--paper);padding:10px 12px;border-radius:8px;max-height:320px;overflow:auto;box-shadow:0 0 0 1px var(--line)}
.note{font-size:13px;color:var(--mute);line-height:1.5;margin:6px 0}
.err{color:var(--bad);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.hb.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hb.quiet{border-color:transparent;background:none;color:var(--mute)}.hb.quiet:hover{color:var(--bad);background:none}

/* settings sheet: the same board */
.sheet{position:fixed;inset:0;z-index:6;display:none;place-items:center;background:rgb(10 14 40/.45);backdrop-filter:blur(4px);padding:26px}
.sheet.open{display:grid}
.sbox{width:min(1080px,100%);height:min(780px,100%);background:var(--paper);border-radius:14px;box-shadow:0 30px 80px -20px rgb(0 0 0/.5);display:grid;grid-template-columns:220px minmax(0,1fr);overflow:hidden}
.snav{background:var(--board);color:var(--bink);padding:20px 12px;display:flex;flex-direction:column;gap:3px}
.snav h2{font-size:26px;font-weight:700;font-stretch:var(--cond);margin:0 10px 16px;line-height:1}
.snav button{border:0;background:none;color:var(--bink);text-align:left;padding:8px 10px;border-radius:7px;font-size:15px;min-height:38px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.snav button:hover{background:var(--bline)}
.snav button[aria-current=true]{background:var(--strip);color:var(--sink);font-weight:600}
.snav small{font-size:12px;opacity:.65}
.spane{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.sbody{overflow:auto;padding:28px 34px 34px}
.shead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.shead h3{font-size:30px;line-height:1;margin:0;font-weight:700;font-stretch:var(--cond)}
.shead p{margin:0;flex-basis:100%;max-width:68ch;color:var(--ink2);font-size:14.5px}
.addrow{display:flex;gap:8px;align-items:center;margin-left:auto}
.addrow select{width:auto;min-width:210px}
.sfoot{display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--pane)}
.list{border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.item>summary{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px 14px 0;list-style:none;color:var(--ink)}
.item>summary::-webkit-details-marker{display:none}
.item>summary:hover .nm{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.item .holder{align-self:stretch;border-radius:3px;background:var(--cc);min-height:40px}
.item .nm{font-size:18px;font-weight:700;font-stretch:var(--cond);line-height:1.2}
.item .nm small{font:500 13px Archivo,sans-serif;color:var(--mute);margin-left:8px;font-stretch:100%}
.item[open]>summary{padding-bottom:8px}
.ib{padding:6px 0 22px 23px;display:grid;gap:14px}
.kind{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--c);color:#fff;font-weight:800;font-stretch:var(--cond);font-size:12px;letter-spacing:.02em}
.item.prov>summary{grid-template-columns:34px minmax(0,1fr) auto}
.item.prov .ib{padding-left:48px}
.route{display:flex;align-items:center;flex-wrap:wrap;gap:0;font-size:13px;margin-top:4px;color:var(--ink2)}
.route .n{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.route .n i{width:7px;height:7px;border-radius:50%;background:var(--cc,var(--ink2))}
.route .e{width:22px;height:1.5px;background:var(--ink2);margin:0 7px;position:relative}
.route .e::after{content:"";position:absolute;right:-1px;top:-3px;border:3.5px solid transparent;border-left:5px solid var(--ink2);border-right:0}
.route.no .e{background:repeating-linear-gradient(90deg,var(--bad) 0 4px,transparent 4px 7px)}.route.no .e::after{border-left-color:var(--bad)}
.route .m{font:12.5px "JetBrains Mono",monospace}
.wire{font-size:13.5px;line-height:1.5;padding:10px 14px;border-radius:8px;background:color-mix(in srgb,var(--ok) 9%,var(--paper));border-left:3px solid var(--ok)}
.wire.no{background:color-mix(in srgb,var(--bad) 7%,var(--paper));border-left-color:var(--bad)}
.wire b{font-weight:700}
.grp{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label.f{display:grid;gap:5px;font-size:13px;color:var(--ink2);font-weight:500}
label.row{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:14px}
label.row input{width:17px;height:17px;accent-color:var(--board)}
input[type=text],input[type=password],input[type=number],select,textarea.in{height:40px;border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:0 11px;font-size:14.5px;color:var(--ink);width:100%;font-weight:400}
input:focus,select:focus,textarea.in:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
textarea.in{height:auto;min-height:92px;padding:9px 11px;font:13px/1.5 "JetBrains Mono",monospace;resize:vertical}
input.mono{font:13.5px "JetBrains Mono",monospace}
.adv{background:var(--pane);border-radius:10px;padding:2px 16px}
.adv[open]{padding-bottom:16px}
.adv>summary{padding:11px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line2);background:var(--paper);border-radius:6px;padding:2px 9px;font:12px "JetBrains Mono",monospace;min-height:26px}
.chips button:hover{border-color:var(--ink2)}
.used{display:flex;gap:5px;flex-wrap:wrap}
.used span{font-size:12px;color:var(--ink2);background:var(--well);border-radius:4px;padding:0 6px;line-height:19px}.used .none{background:none;padding:0;color:var(--mute)}
.roomrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1.4fr) auto;gap:12px;align-items:end;padding:14px 0;border-bottom:1px solid var(--line)}
.roomrow .h{font-size:26px;font-weight:700;color:var(--mute);line-height:40px;font-stretch:var(--cond)}

.gate{position:fixed;inset:0;display:none;place-items:center;background:var(--board);z-index:7;padding:24px}
.gate.open{display:grid}
.gate>div{max-width:520px;background:var(--strip);color:var(--sink);border-radius:8px;display:grid;grid-template-columns:12px minmax(0,1fr);overflow:hidden;box-shadow:0 30px 60px -20px rgb(0 0 0/.5)}
.gate .holder{background:linear-gradient(var(--sink) 0 50%,var(--sig) 50%)}
.gate .gb{padding:28px 30px 26px}
.gate h3{margin:0 0 12px;font-size:34px;line-height:1.02;font-weight:700;font-stretch:var(--cond)}
.gate p{margin:0 0 10px;color:#3a3e4f;font-size:15px}
.gate .hb.primary{background:var(--sink);color:#fff;border-color:var(--sink);height:40px;padding:0 18px;font-size:15px}
.booting #app{visibility:hidden}

@media (prefers-reduced-motion:reduce){.tick::after{animation:none;left:0;width:100%}.strip{transition:none}}
@media(max-width:980px){#app{grid-template-columns:248px minmax(0,1fr) auto}.feed,.lives{padding:0 22px 0 26px}.composer{padding:8px 22px 18px 46px}.empty{margin-left:40px}
.drawer.open{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);z-index:4;box-shadow:-20px 0 40px -20px rgb(0 0 0/.35)}
.sheet{padding:0}.sbox{height:100%;border-radius:0;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.snav{flex-direction:row;overflow-x:auto;padding:10px;align-items:center}.snav h2{margin:0 12px 0 6px;font-size:20px}.snav button{flex:none}.snav small{display:none}}
@media(max-width:640px){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.rail{flex-direction:row;align-items:center;overflow-x:auto}.rail-top{height:52px;padding:0 12px}.brand{display:none}
.rail-scroll{display:flex;align-items:center;padding:0 8px;overflow:visible}.rail h2,.bay,.newroom,#nrslot{display:none}.rooms{display:flex}.rooms button{white-space:nowrap;flex:none;width:auto}
.rail-foot{border:0;padding:0 8px}.rail-foot kbd,.rail-foot span{display:none}
header{padding:0 14px;height:56px}.title h1{font-size:22px}.folder,.readout b{display:none}.hb span{display:none}
.feed,.lives{padding:0 14px}.live,.sys,.day,.sample{margin-left:0}.composer{padding:8px 14px 14px}.pop{left:14px}.empty{margin:6vh 16px 0}
.g2,.g3,.roomrow{grid-template-columns:minmax(0,1fr)}.sbody{padding:18px}.ib,.item.prov .ib{padding-left:0}.addrow{margin-left:0}}

</div>

<script>
{
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const shq = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
const winq = s => /[\s"&|<>^%()]/.test(s) ? '"' + String(s).replace(/"/g, '""') + '"' : String(s);
const PALETTE = ['#c2410c', '#16181f', '#6d4aff', '#0e8c7e', '#d6336c', '#1f7a8c', '#8a5a00', '#4b5563'];
const pad = n => String(n).padStart(2, '0');
const hm = t => new Date(t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
const hms = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const el = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const first = (t, n = 140) => { const s = String(t || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const splitArgs = s => { const out = []; let cur = '', q = null, any = false; for (const ch of String(s)) { if (q) { if (ch === q) q = null; else cur += ch; } else if (ch === '"' || ch === "'") { q = ch; any = true; } else if (/\s/.test(ch)) { if (cur || any) out.push(cur); cur = ''; any = false; } else cur += ch; } if (cur || any) out.push(cur); return out; };
const joinArgs = a => (a || []).map(x => /[\s"']/.test(x) || x === '' ? "'" + x.replace(/'/g, '"') + "'" : x).join(' ');
const clone = v => JSON.parse(JSON.stringify(v));
const KEY = '\u0000KEY\u0000';

/* ---------- catalog: CLIs and providers ---------- */
const CLIS = {
  claude: {label: 'Claude Code', preset: {handle: 'claude', name: 'Claude Code', program: 'claude', format: 'claude', stdin: true, modelFlag: '--model',
    args: ['-p', '--output-format', 'stream-json', '--verbose'], resumeArgs: ['-p', '--resume', '{session}', '--output-format', 'stream-json', '--verbose']},
    plan: 'Claude Pro or Max', login: 'run `claude` and use /login'},
  codex: {label: 'Codex', preset: {handle: 'codex', name: 'Codex', program: 'codex', format: 'codex', stdin: true, modelFlag: '-m',
    args: ['exec', '--json', '-'], resumeArgs: ['exec', '--json', 'resume', '{session}', '-']},
    plan: 'ChatGPT plan', login: 'run `codex login`'},
  gemini: {label: 'Gemini CLI', preset: {handle: 'gemini', name: 'Gemini CLI', program: 'gemini', format: 'gemini', stdin: true, modelFlag: '-m',
    args: ['--output-format', 'json'], resumeArgs: []},
    plan: 'Google account', login: 'run `gemini` and sign in'},
  muse: {label: 'Muse Code', preset: {handle: 'muse', name: 'Muse Code', program: 'muse', format: 'text', stdin: false, modelFlag: '',
    args: ['exec', '--prompt-file', '{prompt_file}'], resumeArgs: []},
    plan: 'Meta account', login: 'run `muse` and sign in'},
  custom: {label: 'Other CLI', preset: {handle: 'agent', name: 'New teammate', program: '', format: 'text', stdin: true, modelFlag: '', args: [], resumeArgs: []},
    plan: 'its own login', login: 'sign in with that CLI'}
};
const CREDS = {
  claude: ['ANTHROPIC_API_KEY', 'ANTHROPIC_AUTH_TOKEN', 'ANTHROPIC_BASE_URL', 'CLAUDE_CODE_USE_VERTEX', 'CLAUDE_CODE_USE_BEDROCK', 'CLAUDE_CODE_USE_FOUNDRY', 'ANTHROPIC_VERTEX_BASE_URL', 'CLAUDE_CODE_SKIP_VERTEX_AUTH'],
  codex: ['CODEX_API_KEY', 'OPENAI_API_KEY', 'OPENAI_BASE_URL'],
  gemini: ['GEMINI_API_KEY', 'GOOGLE_API_KEY', 'GOOGLE_GENAI_USE_VERTEXAI', 'GOOGLE_GEMINI_BASE_URL'],
  muse: ['META_API_KEY'], custom: []
};
const KINDS = {
  default: {label: 'As configured', tag: 'your shell and each CLI\'s own config', short: 'CFG', color: '#6b7280', builtin: true,
    about: 'Leaves everything alone: each CLI uses whatever your shell and its own config already say.'},
  subscription: {label: 'Subscriptions', tag: 'the plans you signed in with', short: 'SUB', color: '#111214', builtin: true,
    about: 'Each CLI uses the plan you signed in with: Claude Pro or Max, a ChatGPT plan, your Google or Meta account. API keys in your shell are hidden from the run so they can\'t take over and bill per token.'},
  anthropic: {name: 'Anthropic API', label: 'Anthropic API key', short: 'ANT', color: '#c2410c', key: true, about: 'Claude Code bills per token to an Anthropic Console key.'},
  openai: {name: 'OpenAI API', label: 'OpenAI API key', short: 'OAI', color: '#0f766e', key: true, about: 'Codex bills per token to an OpenAI Platform key.'},
  vertex: {name: 'Vertex AI', label: 'Google Vertex AI / Model Garden', short: 'GCP', color: '#2563eb', key: false,
    about: 'Claude and Gemini models from your Google Cloud project, signed in with gcloud. Codex reaches OpenAI models on Vertex through the Responses API; for open models in Model Garden, put Codex behind LiteLLM.'},
  litellm: {name: 'LiteLLM', label: 'LiteLLM proxy', short: 'LLM', color: '#7c3aed', key: true,
    about: 'One LiteLLM proxy for everyone: Claude Code talks to its Anthropic endpoint, Codex to /v1/responses, Gemini CLI to its Gemini route. Model names are the model_name entries in your LiteLLM config.'},
  gateway: {name: 'Gateway', label: 'Other gateway', short: 'GW', color: '#be185d', key: true, about: 'Any gateway that speaks one of the APIs these CLIs use.'},
  env: {name: 'Custom env', label: 'Custom environment', short: 'ENV', color: '#4d7c0f', key: true,
    about: 'Your own environment variables for a run, one KEY=value per line. Write {key} where the key goes. Use it for anything not listed here: Bedrock, OpenRouter, a Gemini API key, Muse with META_API_KEY.'}
};
const ADDABLE = ['litellm', 'vertex', 'anthropic', 'openai', 'gateway', 'env'];
const BUILTIN = [{id: 'default', kind: 'default', name: 'As configured'}, {id: 'subscription', kind: 'subscription', name: 'Subscriptions'}];
const SUGGEST = {
  vertex: ['claude-opus-4-8', 'claude-sonnet-5', 'claude-haiku-4-5@20251001', 'gemini-2.5-pro', 'gemini-2.5-flash', 'gpt-6-luna'],
  anthropic: ['claude-opus-4-8', 'claude-sonnet-5'], openai: ['gpt-6-luna']
};

const DEFAULT_TEAM = () => ({
  version: 2, humanName: '', maxHops: 6, maxRuns: 6, reviewByLead: true, notify: true,
  rooms: [{id: 'general', name: 'general', cwd: '~'}],
  providers: [],
  agents: [
    {...CLIS.claude.preset, kind: 'claude', role: 'lead', mode: 'spawn', enabled: true, provider: 'subscription', model: '', cwd: '', color: '#c2410c'},
    {...CLIS.codex.preset, kind: 'codex', role: 'worker', mode: 'spawn', enabled: true, provider: 'subscription', model: '', cwd: '', color: '#16181f'},
    {...CLIS.muse.preset, kind: 'muse', role: 'worker', mode: 'spawn', enabled: true, provider: 'subscription', model: '', cwd: '', color: '#0e8c7e'}
  ]
});

const S = {mode: 'boot', D: null, platform: '', home: '', base: '', shell: '/bin/zsh', env: null, team: DEFAULT_TEAM(),
  rooms: new Map(), room: 'general', routed: new Set(), sessions: {}, lastSeen: {}, runs: new Map(), queues: new Map(),
  avail: {}, paused: false, drawer: null, logRun: null, toggles: new Set(), teamMtime: 0, humanName: 'You', trayOff: false, newRoom: false,
  secrets: {}, keyCache: {}, draft: null, draftSecrets: {}, tab: 'teammates', ptest: {}, sheetOpen: false};

const agents = () => S.team.agents;
const agentBy = h => agents().find(a => a.handle === String(h || '').toLowerCase());
const lead = () => agents().find(a => a.role === 'lead' && a.enabled);
const providersOf = t => BUILTIN.concat(t.providers || []);
const providerBy = (id, t = S.team) => providersOf(t).find(p => p.id === id) || BUILTIN[0];
const cur = () => S.rooms.get(S.room) || [...S.rooms.values()][0];
const expand = p => { p = String(p || '~').trim() || '~'; if (!S.home) return p; return p === '~' ? S.home : p.startsWith('~/') ? S.home + p.slice(1) : p; };
const tilde = p => S.home && String(p).startsWith(S.home) ? '~' + String(p).slice(S.home.length) : String(p);
const roomPath = id => `${S.base}/rooms/${id}.jsonl`;
const initials = n => { const w = String(n).trim().split(/\s+/); return (w.length > 1 ? w[0][0] + w[1][0] : String(n).slice(0, 2)).toUpperCase(); };
const slug = (s, n = 32) => String(s).toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, n);
const rootUrl = u => String(u || '').trim().replace(/\/+$/, '').replace(/\/v1$/, '');

function normalizeTeam(t) {
  const d = DEFAULT_TEAM();
  t = (t && typeof t === 'object') ? t : d;
  t.version = 2;
  t.maxHops = Math.min(50, Math.max(1, parseInt(t.maxHops, 10) || 6));
  t.maxRuns = Math.min(16, Math.max(1, parseInt(t.maxRuns, 10) || 6));
  t.reviewByLead = t.reviewByLead !== false; t.notify = t.notify !== false;
  t.humanName = typeof t.humanName === 'string' ? t.humanName.slice(0, 40) : '';
  const pids = new Set(['default', 'subscription']);
  t.providers = (Array.isArray(t.providers) ? t.providers : []).filter(p => p && ADDABLE.includes(p.kind) && /^[a-z0-9][a-z0-9_-]{0,31}$/.test(p.id || '') && !pids.has(p.id) && pids.add(p.id)).map(p => ({
    id: p.id, kind: p.kind, name: String(p.name || KINDS[p.kind].name).slice(0, 60),
    baseUrl: String(p.baseUrl || (p.kind === 'litellm' ? 'http://localhost:4000' : '')).trim(),
    project: String(p.project || '').trim(), region: String(p.region || 'global').trim(), credentials: String(p.credentials || '').trim(),
    protocol: ['anthropic', 'openai', 'gemini'].includes(p.protocol) ? p.protocol : 'anthropic', authHeader: p.authHeader === 'x-api-key' ? 'x-api-key' : 'bearer',
    keySource: ['none', 'env', 'command', 'saved'].includes(p.keySource) ? p.keySource : (KINDS[p.kind].key ? 'env' : 'none'),
    keyEnv: String(p.keyEnv || '').trim(), keyCmd: String(p.keyCmd || '').trim(), envText: String(p.envText || ''),
    models: Array.isArray(p.models) ? p.models.map(String).slice(0, 300) : []}));
  const seen = new Set();
  t.agents = (Array.isArray(t.agents) ? t.agents : d.agents).filter(a => a && /^[a-z0-9][a-z0-9_-]{0,23}$/.test(String(a.handle || '').toLowerCase())).map((a, i) => {
    const h = String(a.handle).toLowerCase();
    if (seen.has(h)) return null; seen.add(h);
    const kind = CLIS[a.kind] ? a.kind : a.format === 'claude' ? 'claude' : a.format === 'codex' ? 'codex' : a.format === 'gemini' ? 'gemini' : /(^|\/)muse$/.test(a.program || '') ? 'muse' : 'custom';
    return {handle: h, name: String(a.name || h).slice(0, 40), kind, role: a.role === 'lead' ? 'lead' : 'worker',
      mode: a.mode === 'external' ? 'external' : 'spawn', enabled: a.enabled !== false,
      program: String(a.program ?? CLIS[kind].preset.program), args: Array.isArray(a.args) ? a.args.map(String) : [],
      resumeArgs: Array.isArray(a.resumeArgs) ? a.resumeArgs.map(String) : [], stdin: a.stdin !== false,
      format: ['claude', 'codex', 'gemini', 'text'].includes(a.format) ? a.format : 'text', cwd: String(a.cwd || ''),
      provider: pids.has(a.provider) ? a.provider : (a.provider ? 'default' : 'subscription'), model: String(a.model || '').trim(),
      modelFlag: typeof a.modelFlag === 'string' ? a.modelFlag.trim() : CLIS[kind].preset.modelFlag,
      color: /^#[0-9a-f]{3,8}$/i.test(a.color || '') ? a.color : PALETTE[i % PALETTE.length]};
  }).filter(Boolean);
  let leads = 0; for (const a of t.agents) if (a.role === 'lead' && leads++) a.role = 'worker';
  t.agents.forEach(a => { a.av = initials(a.name); });
  const rs = new Set();
  t.rooms = (Array.isArray(t.rooms) ? t.rooms : d.rooms).filter(r => r && /^[a-z0-9][a-z0-9_-]{0,39}$/.test(r.id || '') && !rs.has(r.id) && rs.add(r.id))
    .map(r => ({id: r.id, name: String(r.name || r.id).slice(0, 40), cwd: String(r.cwd || '~')}));
  if (!t.rooms.length) t.rooms = d.rooms;
  return t;
}

/* ---------- wiring: what a teammate's run needs for its provider ---------- */
function hasKey(p, secrets = S.secrets, draftSecrets = {}) {
  if (!KINDS[p.kind]?.key || p.keySource === 'none') return true;
  if (p.keySource === 'env') return !!p.keyEnv;
  if (p.keySource === 'command') return !!p.keyCmd;
  return draftSecrets[p.id] === null ? false : !!(draftSecrets[p.id] || secrets[p.id]);
}
function keyWhere(p) {
  if (!KINDS[p.kind]?.key || p.keySource === 'none') return 'no key';
  if (p.keySource === 'env') return `key from $${p.keyEnv || '?'}`;
  if (p.keySource === 'command') return 'key from a command';

function setPath(o, path, v) { const ks = path.split('.'); let x = o; for (const k of ks.slice(0, -1)) x = x[k]; x[ks[ks.length - 1]] = v; }

async function saveSettings() {
  const t = S.draft, err = m => { $('#serr').textContent = m; };
  if (S.mode !== 'live') return;
  for (const [i, a] of t.agents.entries()) {
    a.handle = String(a.handle || '').trim().toLowerCase().replace(/^@/, '');
    if (!/^[a-z0-9][a-z0-9_-]{0,23}$/.test(a.handle)) { S.tab = 'teammates'; renderSheet(); return err(`${a.name || 'Teammate ' + (i + 1)} needs a handle: letters, digits, - or _.`); }
    if (a.mode === 'spawn' && !a.program) { S.tab = 'teammates'; renderSheet(); return err(`${a.name} needs a command.`); }
  }
  if (new Set(t.agents.map(a => a.handle)).size !== t.agents.length) return err('Two teammates share a handle.');
  if (t.agents.filter(a => a.role === 'lead').length > 1) return err('Only one lead, please.');
  for (const r of t.rooms) if (!(await S.D.fs.exists(expand(r.cwd)).catch(() => false))) { S.tab = 'rooms'; renderSheet(); return err(`${r.cwd} doesn't exist.`); }
  const ids = new Set(t.providers.map(p => p.id));
  const secrets = {...S.secrets};
  for (const [id, v] of Object.entries(S.draftSecrets)) { if (v === null) delete secrets[id]; else secrets[id] = v; }
  for (const id of Object.keys(secrets)) if (!ids.has(id)) delete secrets[id];
  try {
    if (JSON.stringify(secrets) !== JSON.stringify(S.secrets)) await saveSecrets(secrets);
    S.team = normalizeTeam(clone(t)); await saveTeam();
  } catch (x) { return err(x.message); }
  S.humanName = S.team.humanName || S.osName || S.humanName;
  for (const p of S.team.providers) delete S.keyCache[p.id];
  closeSettings(); ensureRooms();
  for (const r of S.rooms.values()) if (r.size < 0) await readRoom(r, true);
  renderAll(); checkAvail();
}
async function saveSecrets(v) {
  const p = `${S.base}/secrets.json`;
  await writeJSON(p, v);
  if (S.platform !== 'win32') await S.D.childProcess.exec(`chmod 600 ${shq(p)}`, {timeout: 5000}).catch(() => {});
  S.secrets = v;
}
async function curlJSON(url, headers) {
  const cfg = `url = "${url.replace(/["\\]/g, '\\$&')}"\n` + headers.map(h => `header = "${h.replace(/["\\]/g, '\\$&')}"\n`).join('');
  const r = await S.D.childProcess.exec(`curl -sS -m 12 -w "\\n%{http_code}" -K -`, {timeout: 20000, input: cfg, env: S.env || undefined});
  if (r.code !== 0) throw new Error(first(r.stderr || 'curl failed', 200));
  const out = r.stdout || '', i = out.lastIndexOf('\n'), status = +out.slice(i + 1), body = out.slice(0, i);
  let json = null; try { json = JSON.parse(body); } catch {}
  return {status, json, body};
}
async function testProvider(id) {
  const t = S.draft || S.team, p = providerBy(id, t), done = (ok, msg) => { S.ptest[id] = {ok, msg}; if (S.sheetOpen) renderSheet(); };
  S.ptest[id] = {ok: true, msg: 'Testing…'}; if (S.sheetOpen) renderSheet();
  try {
    const cp = S.D.childProcess;
    if (p.kind === 'subscription') {
      const lines = [];
      for (const a of t.agents.filter(x => x.provider === 'subscription' && x.enabled && x.mode === 'spawn')) {
        if (a.kind === 'codex') { const r = await cp.exec(`${shq(a.program)} login status`, {timeout: 15000, env: S.env || undefined}).catch(e => ({code: 1, stderr: e.message})); lines.push(`@${a.handle}: ${first((r.stdout || r.stderr || '').trim() || 'no answer', 90)}`); }
        else lines.push(`@${a.handle}: ${CLIS[a.kind].login} if it asks`);
      }
      return done(true, lines.join('. ') || 'No teammates use subscriptions.');
    }
    if (p.kind === 'vertex') {
      if (!p.project) return done(false, 'Set a project ID first.');
      const env = {...(S.env || {})}; if (p.credentials) env.GOOGLE_APPLICATION_CREDENTIALS = expand(p.credentials);
      const r = await cp.exec('gcloud auth application-default print-access-token', {timeout: 20000, env});
      if (r.code !== 0 || !r.stdout.trim()) return done(false, first(r.stderr || 'gcloud could not get a token. Run gcloud auth application-default login.', 200));
      return done(true, `gcloud credentials work. Requests go to ${p.project} in ${p.region || 'global'}; model access is checked on the first run.`);
    }
    if (p.kind === 'env') return done(true, 'Nothing to test here. Run a teammate and read its log.');
    const key = await resolveKey(p, S.draftSecrets[p.id]);
    let url, headers = [];
    if (p.kind === 'anthropic') { url = 'https://api.anthropic.com/v1/models?limit=100'; headers = ['x-api-key: ' + key, 'anthropic-version: 2023-06-01']; }
    else if (p.kind === 'openai') { url = 'https://api.openai.com/v1/models'; headers = ['Authorization: Bearer ' + key]; }
    else if (p.kind === 'litellm') { url = rootUrl(p.baseUrl) + '/v1/models'; if (key) headers = ['Authorization: Bearer ' + key]; }
    else if (p.protocol === 'anthropic') { url = p.baseUrl.replace(/\/+$/, '') + '/v1/models'; if (key) headers = [p.authHeader === 'x-api-key' ? 'x-api-key: ' + key : 'Authorization: Bearer ' + key, 'anthropic-version: 2023-06-01']; }
    else if (p.protocol === 'openai') { url = p.baseUrl.replace(/\/+$/, '') + '/models'; if (key) headers = ['Authorization: Bearer ' + key]; }
    else return done(true, 'No test for Gemini-format gateways yet. Run a teammate and read its log.');
    const r = await curlJSON(url, headers);
    if (r.status === 401 || r.status === 403) return done(false, `The key was rejected (${r.status}).`);
    if (r.status !== 200) return done(false, `HTTP ${r.status || '?'} from ${url}: ${first(r.json?.error?.message || r.body, 140)}`);
    const models = (r.json?.data || []).map(m => m.id).filter(Boolean);
    const live = (S.draft || S.team).providers.find(x => x.id === id); if (live) live.models = models.slice(0, 300);
    const real = S.team.providers.find(x => x.id === id); if (real && S.draft) { real.models = models.slice(0, 300); saveTeam().catch(() => {}); }
    return done(true, `Connected. ${models.length} model${models.length === 1 ? '' : 's'} available.`);
  } catch (e) { done(false, e.message); }
}

async function writeJSON(p, v) { const tmp = p + '.tmp'; await S.D.fs.writeFile(tmp, JSON.stringify(v, null, 2) + '\n'); await S.D.fs.rename(tmp, p); }

function parseMsg(line) {
  try {

    if (!m || typeof m.id !== 'string' || typeof m.text !== 'string') return null;
    return {id: m.id.slice(0, 80), ts: Number(m.ts) || 0, from: String(m.from || 'human').toLowerCase().slice(0, 40),

  const f = e.target, name = f.name.value.trim(), cwd = f.cwd.value.trim() || '~', id = slug(name, 40);
  if (!id) { $('#nrerr').textContent = 'Give it a name.'; return; }
  if (S.rooms.has(id)) { $('#nrerr').textContent = 'That room exists.'; return; }
  if (!(await S.D.fs.exists(expand(cwd)).catch(() => false))) { $('#nrerr').textContent = `${cwd} doesn't exist.`; return; }
  S.team.rooms.push({id, name: id, cwd}); await saveTeam(); ensureRooms();
  await readRoom(S.rooms.get(id), true); S.room = id; showNewRoom(false); renderAll();
});
window.addEventListener('focus', () => { const r = cur(); if (r?.unread) { r.unread = 0; renderRail(); } badge(); });
setInterval(() => { for (const n of document.querySelectorAll('[data-start]')) n.textContent = el(Date.now() - +n.dataset.start); }, 1000);

boot();
}
</script>
